# v0.0.2 TEST CASE 2: "ZeroBus Ingestion to Bronze (single JSON column), TWO tables".
#
# Streams both single-JSON-column Zerobus-style bus tables
# (flowx.zerobus_v0_0_2.orders_event_bus / .devices_event_bus) into two Bronze
# streaming tables in flowx.bronze_v0_0_2_tc2, landing each raw JSON document
# unparsed. See flowx_testing/v0_0_2_tc2_zerobus_bronze.json.

resources:
  pipelines:
    flowx_test_v0_0_2_tc2_zerobus_bronze_pipeline:
      name: flowx_test_v0_0_2_tc2_zerobus_bronze_pipeline_${bundle.target}
      catalog: flowx
      schema: bronze_v0_0_2_tc2
      serverless: true
      photon: true
      development: true
      continuous: false

      libraries:
        - notebook:
            path: ../../notebooks/03_engine/03_lakeflow_declarative_pipeline.py

      environment:
        dependencies:
          - ../../dist/*.whl

      configuration:
        dataflow.group.id: dfg_v0_0_2_tc2_zerobus_bronze
        dataflow.control.catalog: flowx
