# TC5 (v0.0.2) -- "Metrics OFF": the telemetry-OFF half of the TC4/TC5 matched pair.
# Spec: flowx_testing/v0_0_2_tc5_metrics_off.json
#
# The pair exists to compare functional parity and runtime cost between the two
# reconciliation telemetry modes. This pipeline's reconciliation flow sets
# logging_config {run_log_capture: false, mismatch_log_capture: false} -- silent, the v1.7.3
# default -- while the TC4 pipeline sets both true. Everything else about the two is identical.
#
# THIS PIPELINE AND THE TC4 PIPELINE MUST STAY SEPARATE RESOURCES. A Lakeflow dataset has
# exactly one owning pipeline, and the two specs deliberately declare different
# dataflow_group_ids and different target schemas/tables so their control-table rows and their
# published tables never collide. One pipeline per dataflow group, by construction.
#
# schema is the DEFAULT publishing schema for datasets whose spec does not name one; every
# flow in this spec carries an explicit target_schema (bronze_tc5_metrics / silver_tc5_metrics),
# so this value only backstops the pipeline-registered reconciliation datasets. With both
# capture flags false this flow registers no recon__*__metrics dataset at all, which is the
# whole point of the OFF half.

resources:
  pipelines:
    flowx_test_v0_0_2_tc5_metrics_off_pipeline:
      name: flowx_test_v0_0_2_tc5_metrics_off_pipeline_${bundle.target}
      catalog: flowx
      schema: bronze_tc5_metrics
      serverless: true
      photon: true
      development: true
      continuous: false

      libraries:
        - notebook:
            path: ../../notebooks/03_engine/03_lakeflow_declarative_pipeline.py

      environment:
        dependencies:
          - ../../dist/*.whl

      configuration:
        dataflow.group.id: dfg_v0_0_2_tc5_metrics_off
        dataflow.control.catalog: flowx
