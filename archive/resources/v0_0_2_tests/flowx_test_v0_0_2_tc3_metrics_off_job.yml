# Wraps flowx_test_v0_0_2_tc3_metrics_off_pipeline (v0.0.2 TEST CASE 3):
#
#   setup_control_tables -> seed_tc3_source_data -> onboard_tc3_metrics_off
#     -> run_tc3_metrics_off_pipeline
#
# NO run_observability_task. Every other dedicated test job in this bundle ends with one, and
# omitting it here is deliberate rather than an oversight: TC3's entire assertion is that the
# run leaves telemetry dormant (zero reconciliation_run_log rows, zero mismatch-log rows, no
# recon__*__metrics dataset). Appending an observability export task would both add the very
# telemetry writes the test case is checking for the absence of, and -- since this spec declares
# no "observability" destinations array -- fail loudly on every run for a reason unrelated to
# what is being tested.
#
# Onboarding is DELEGATED to the generic, parameterised onboarding_job
# (resources/flowx_config_jobs/onboarding_job.yml) via run_job_task. Never inline a
# 02_onboarding_engine.py notebook_task in a new job -- the ~20 legacy job files that do so are
# the drift this delegation exists to stop.
#
# seed_tc3_source_data runs this scenario's OWN seed notebook (not the shared
# 02_seed_flowx_testing_data.py): the tc3_usecase schema, its two landing Volumes and the two
# source CSVs exist in no other fixture, so the pipeline has nothing to read without it.

resources:
  jobs:
    flowx_test_v0_0_2_tc3_metrics_off_job:
      name: FlowX Test v0.0.2 - TC3 Batch CDC SQL JSON Delta Append (Metrics and Logs OFF)

      tasks:
        - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../../notebooks/01_setup/01_setup_control_tables.py
            base_parameters:
              catalog: flowx
          environment_key: framework_env

        - task_key: seed_tc3_source_data
          depends_on:
            - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../../notebooks/00_seed_sample_data/03_seed_v0_0_2_tc3_batch_cdc_sql_data.py
            base_parameters:
              catalog: flowx
          environment_key: framework_env

        - task_key: onboard_tc3_metrics_off
          depends_on:
            - task_key: seed_tc3_source_data
          run_job_task:
            job_id: ${resources.jobs.onboarding_job.id}
            job_parameters:
              spec_file_path: "${workspace.file_path}/flowx_testing/v0_0_2_tc3_batch_cdc_sql_metrics_off.json"
              catalog: flowx
              env: dev
              action_type: CREATE

        - task_key: run_tc3_metrics_off_pipeline
          depends_on:
            - task_key: onboard_tc3_metrics_off
          pipeline_task:
            pipeline_id: ${resources.pipelines.flowx_test_v0_0_2_tc3_metrics_off_pipeline.id}

      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../../dist/*.whl
