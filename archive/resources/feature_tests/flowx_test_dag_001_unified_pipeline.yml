# TC-DAG-001 (v1.5.0 Module 12): "Read-Once Source Plane Across Three Flow Kinds" -- one
# external physical table, {{catalog}}.dag_001_usecase.shared_source_bus, is read by THREE
# different flow kinds inside this ONE unified Lakeflow pipeline:
#
#   1. ingestion_flows[0]'s own zerobus source_config (streams it into bronze_dag_001.
#      shared_source_bronze).
#   2. transformation_flows[0]'s source_inputs[0] ("shared_source_direct"), reading the SAME
#      locator directly rather than through ingestion's own Bronze output.
#   3. reconciliation_flows[0]'s target_configs[0] (the raw bus, compared target_to_source
#      against the freshly-ingested Bronze copy).
#
# Fanout on this one locator is 3 (>= the source_plane "auto" materialization threshold of 2)
# and the ingestion consumer streams, so engine/source_plane.py must register exactly ONE
# materialized L0 node -- a streaming table (`_src__shared_source_bus__<8hex>__stream`) -- and
# reuse it for all three, so the pipeline's own event log shows exactly one physical read of
# this locator per update. See flowx_testing/049_dag_001_unified_three_flow.json,
# flowx_testing/TESTING_PLAN.md's Module 12 / TC-DAG-001 row, and docs/13's CANONICAL
# IDENTITY / SHARING RULES sections.
#
# reconciliation_flows[0] (recon_dag_001_bronze_vs_raw_bus) sets execution_mode: "pipeline" and
# dataflow_group_id: dfg_dag_001_unified_three_flow (this same group), so its L3/L4 datasets
# (_recon__..._src, recon__..._classified, recon__..._metrics) are hosted in THIS pipeline too.
# It does not set publish_schema, so those datasets publish into this pipeline's own `schema:`
# below (bronze_dag_001) per the documented default.
#
# KNOWN LIMITATION (not fixed by this resource): no seed notebook for
# {{catalog}}.dag_001_usecase.shared_source_bus exists yet in notebooks/00_seed_sample_data/,
# and this spec's ingestion_flows[]/reconciliation_flows[] declare no "observability"
# destinations array -- so a live run of this pipeline needs that source table pre-populated
# out of band, and the paired job's observability_export task (see
# flowx_test_dag_001_unified_job.yml) will fail loudly with "No enabled observability_config
# destinations resolved" until an observability array is added to the onboarding spec. Both are
# offline-verified-only per flowx_testing/TESTING_STATUS.md as of this build step; neither
# gap is silently worked around here.

resources:
  pipelines:
    flowx_test_dag_001_unified_pipeline:
      name: flowx_test_dag_001_unified_pipeline_${bundle.target}
      catalog: flowx
      schema: bronze_dag_001
      serverless: true
      photon: true
      development: true
      continuous: false

      libraries:
        - notebook:
            path: ../../notebooks/03_engine/03_lakeflow_declarative_pipeline.py

      environment:
        dependencies:
          - ../../dist/*.whl

      configuration:
        dataflow.group.id: dfg_dag_001_unified_three_flow
        dataflow.control.catalog: flowx
