# TC-R2-001 -- the dedicated job for proving reconciliation runs INSIDE the Lakeflow
# Declarative Pipeline DAG (v1.5.0, Module 12).
#
#   setup_control_tables -> seed_flowx_testing_data -> onboard_003 -> run_003_pipeline
#
# WHY THIS EXISTS SEPARATELY FROM flowx_test_002_003_job:
# That job proves the 002 -> 003 cross-group healing story and needs a full 002 Zerobus run
# first, so a reconciliation-only re-test pays for scenario 002 every time. This job is the
# narrow one: it re-onboards 003 (whose reconciliation flow now sets
# execution_mode: "pipeline") and runs 003's pipeline, which is the single update where
# ingestion, transformation and reconciliation all register into one DAG.
#
# WHY IT REUSES flowx_test_003_autoload_recon_pipeline RATHER THAN DECLARING ITS OWN:
# a Lakeflow dataset has exactly one owning pipeline. A second pipeline pointed at
# dataflow_group_id dfg_flowx_003_autoload_recon would try to define
# flowx.bronze_excalibur.autoload_bronze a second time and the two updates would fight over
# that table's transaction log. There is one pipeline per dataflow group, by construction.
#
# setup_control_tables is NOT boilerplate here -- it is load-bearing. It calls
# ensure_control_schema_exists, which now also runs
# schema_provisioner.ensure_control_table_columns, the additive migration that adds
# execution_mode / publish_schema / dq_config_json to an ALREADY-PROVISIONED
# reconciliation_flow_spec. Every statement in get_all_control_table_ddls is
# CREATE TABLE IF NOT EXISTS and so is a no-op against an existing table, which means a
# workspace onboarded before v1.5.0 has none of those columns and onboarding a pipeline-mode
# reconciliation flow fails with UNRESOLVED_COLUMN until this task has run once.
# `databricks bundle deploy` does NOT apply that migration; only running this task does.
#
# ONBOARDING IS NEVER INLINED HERE. The onboard step is a run_job_task against the generic
# resources/flowx_config_jobs/onboarding_job.yml, which is the single parameterised onboarding entrypoint for the
# whole bundle (`spec_file_path`, `catalog`, `env`, `action_type`). New jobs must delegate to it
# rather than declaring their own 02_onboarding_engine.py notebook_task -- the older
# flowx_test_*_job.yml files that each pin an inline copy are legacy, and duplicating that
# pattern is how the onboarding contract drifts between callers.
#
# There is deliberately no reconciliation task in this graph. Under execution_mode "pipeline"
# the L3 prepare / L4 compare / L5 heal datasets are registered by run_003_pipeline itself --
# a standalone 05_reconciliation_engine.py task here would run the comparison a SECOND time and
# double-append into Excalibur_usecase.zerobus_source_bus. Observability stays a separate job
# task by design (R3) and is not included in this narrow job; use
# flowx_test_002_003_job or the observability job for that.

resources:
  jobs:
    flowx_test_recon_dag_job:
      name: FlowX Test RECON-DAG - Reconciliation Inside the Lakeflow DAG (TC-R2-001)

      tasks:
        - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../../notebooks/01_setup/01_setup_control_tables.py
            base_parameters:
              catalog: flowx
          environment_key: framework_env

        - task_key: seed_flowx_testing_data
          depends_on:
            - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../../notebooks/00_seed_sample_data/02_seed_flowx_testing_data.py
            base_parameters:
              catalog: flowx
          environment_key: framework_env

        # Onboarding is DELEGATED to the generic, parameterised onboarding_job rather than
        # re-declaring a 02_onboarding_engine.py notebook_task here. There is one onboarding
        # entrypoint in this bundle and every job calls it; a job that inlines its own copy is
        # a second place that has to be found and edited whenever the onboarding notebook grows
        # a parameter or changes a default, and the older flowx_test_*_job.yml files that
        # each pin their own inline copy are exactly the drift this avoids repeating.
        - task_key: onboard_003
          depends_on:
            - task_key: seed_flowx_testing_data
          run_job_task:
            job_id: ${resources.jobs.onboarding_job.id}
            job_parameters:
              spec_file_path: "${workspace.file_path}/flowx_testing/003_autoload_recon_append.json"
              catalog: flowx
              env: dev
              action_type: CREATE

        - task_key: run_003_pipeline
          depends_on:
            - task_key: onboard_003
          pipeline_task:
            pipeline_id: ${resources.pipelines.flowx_test_003_autoload_recon_pipeline.id}

      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../../dist/*.whl
