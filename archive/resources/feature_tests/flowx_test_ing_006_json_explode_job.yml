# Wraps flowx_test_ing_006_json_explode_pipeline:
#
#   setup_control_tables -> seed_ing_006_json_explode_data -> onboard_ing_006 -> run_ing_006_pipeline
#
# Self-contained: seeds its own dedicated iot/bronze_iot schemas + landing_json volume fixture
# (2 device JSON records, each with a nested 2-element "metrics" array) rather than reusing any
# other scenario's fixtures, since no existing seeded table/volume carries this nested-JSON
# shape. See notebooks/00_seed_sample_data/03_seed_ing_006_json_explode_data.py and
# flowx_testing/015_ing_006_json_explode.json.

resources:
  jobs:
    flowx_test_ing_006_json_explode_job:
      name: FlowX Test TC-ING-006 - Nested JSON Struct Flattening (explode_columns)

      tasks:
        - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../../notebooks/01_setup/01_setup_control_tables.py
            base_parameters:
              catalog: flowx
          environment_key: framework_env

        - task_key: seed_ing_006_json_explode_data
          depends_on:
            - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../../notebooks/00_seed_sample_data/03_seed_ing_006_json_explode_data.py
            base_parameters:
              catalog: flowx
          environment_key: framework_env

        - task_key: onboard_ing_006
          depends_on:
            - task_key: seed_ing_006_json_explode_data
          notebook_task:
            notebook_path: ../../notebooks/02_onboarding/02_onboarding_engine.py
            base_parameters:
              spec_file_path: "${workspace.file_path}/flowx_testing/015_ing_006_json_explode.json"
              catalog: flowx
              env: dev
              action_type: CREATE
          environment_key: framework_env

        - task_key: run_ing_006_pipeline
          depends_on:
            - task_key: onboard_ing_006
          pipeline_task:
            pipeline_id: ${resources.pipelines.flowx_test_ing_006_json_explode_pipeline.id}

      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../../dist/*.whl
