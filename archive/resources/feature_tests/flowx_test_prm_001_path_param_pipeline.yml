# TC-PRM-001: "Parameterized Dynamic Volume & File Paths" -- the KEY test for this session's new
# transformation/parameters.py::substitute_path_parameters capability. source_config.path and
# schema_location carry ${data_domain}/${batch_date} placeholders (pipeline_parameters:
# {"data_domain": "finance_ops", "batch_date": "2026-08-28"}), resolved fresh on every pipeline
# update -- NOT at onboarding time like {{catalog}}/{{env}} -- so the engine notebook reads
# /Volumes/flowx/finance_ops/landing/2026-08-28/ at graph-definition time. See
# flowx_testing/045_prm_001_path_param.json.

resources:
  pipelines:
    flowx_test_prm_001_path_param_pipeline:
      name: flowx_test_prm_001_path_param_pipeline_${bundle.target}
      catalog: flowx
      schema: bronze_finance
      serverless: true
      photon: true
      development: true
      continuous: false

      libraries:
        - notebook:
            path: ../../notebooks/03_engine/03_lakeflow_declarative_pipeline.py

      environment:
        dependencies:
          - ../../dist/*.whl

      configuration:
        dataflow.group.id: dfg_prm_001_path_param
        dataflow.control.catalog: flowx
