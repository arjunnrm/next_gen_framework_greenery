# Wraps flowx_test_ing_007_standardize_pipeline:
#
#   setup_control_tables -> seed_ing_007_standardize_data -> onboard_ing_007 -> run_ing_007_pipeline
#
# Self-contained: seeds its own dedicated master/bronze_master schemas + landing_companies
# volume fixture (3 dirty company records with padded/mixed-case region and email values)
# rather than reusing any other scenario's fixtures, since no existing seeded table/volume
# carries this dirty-string-standardization shape. See
# notebooks/00_seed_sample_data/03_seed_ing_007_standardize_data.py and
# flowx_testing/016_ing_007_standardize.json.

resources:
  jobs:
    flowx_test_ing_007_standardize_job:
      name: FlowX Test TC-ING-007 - Inline Data Standardization SQL

      tasks:
        - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../../notebooks/01_setup/01_setup_control_tables.py
            base_parameters:
              catalog: flowx
          environment_key: framework_env

        - task_key: seed_ing_007_standardize_data
          depends_on:
            - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../../notebooks/00_seed_sample_data/03_seed_ing_007_standardize_data.py
            base_parameters:
              catalog: flowx
          environment_key: framework_env

        - task_key: onboard_ing_007
          depends_on:
            - task_key: seed_ing_007_standardize_data
          notebook_task:
            notebook_path: ../../notebooks/02_onboarding/02_onboarding_engine.py
            base_parameters:
              spec_file_path: "${workspace.file_path}/flowx_testing/016_ing_007_standardize.json"
              catalog: flowx
              env: dev
              action_type: CREATE
          environment_key: framework_env

        - task_key: run_ing_007_pipeline
          depends_on:
            - task_key: onboard_ing_007
          pipeline_task:
            pipeline_id: ${resources.pipelines.flowx_test_ing_007_standardize_pipeline.id}

      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../../dist/*.whl
