# TC-SEC-002: "SHA-256 Hash Key & Value Determinism" -- proves cdc_load_strategy "SCD1" (a
# CDC-dispatched strategy) triggers __framework_hash_key/__framework_hash_value generation
# (cdc/hashing.py::compute_hash_columns, invoked from dq/quarantine.py::
# _apply_hash_columns) for a composite primary key (region, account_id),
# genuinely and deterministically: __framework_hash_key equals
# sha2(concat_ws('||', region, account_id), 256) for every row. See
# flowx_testing/034_sec_002_hashing.json and docs/55_tc_sec_002.md.

resources:
  pipelines:
    flowx_test_sec_002_hashing_pipeline:
      name: flowx_test_sec_002_hashing_pipeline_${bundle.target}
      catalog: flowx
      schema: silver_accounts
      serverless: true
      photon: true
      development: true
      continuous: false

      libraries:
        - notebook:
            path: ../../notebooks/03_engine/03_lakeflow_declarative_pipeline.py

      environment:
        dependencies:
          - ../../dist/*.whl

      configuration:
        dataflow.group.id: dfg_sec_002_hashing
        dataflow.control.catalog: flowx
