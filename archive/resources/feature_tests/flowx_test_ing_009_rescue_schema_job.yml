# Wraps flowx_test_ing_009_rescue_schema_pipeline:
#
#   setup_control_tables -> seed_ing_009_rescue_schema_data -> onboard_ing_009 -> run_ing_009_pipeline
#
# Self-contained: seeds its own dedicated ops/bronze_ops schemas + landing_drift volume fixture
# (day-1 only: a 3-row [id, name] CSV batch) rather than reusing any other scenario's fixtures,
# since no existing seeded table/volume carries this drift-feed shape. This job run only
# exercises the day-1 (clean-schema) load -- the day-2 drift batch
# (sample_data/flowx_testing/ops_usecase/feed_day2.csv, adding an unannounced
# "unannounced_flag" column plus one row with a non-numeric "id") is landed and re-triggered
# manually afterwards; see docs/39_tc_ing_009.md's "Triggering day-2 schema drift" section.

resources:
  jobs:
    flowx_test_ing_009_rescue_schema_job:
      name: FlowX Test TC-ING-009 - Schema Evolution & Malformed Column Rescue

      tasks:
        - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../../notebooks/01_setup/01_setup_control_tables.py
            base_parameters:
              catalog: flowx
          environment_key: framework_env

        - task_key: seed_ing_009_rescue_schema_data
          depends_on:
            - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../../notebooks/00_seed_sample_data/03_seed_ing_009_rescue_schema_data.py
            base_parameters:
              catalog: flowx
          environment_key: framework_env

        - task_key: onboard_ing_009
          depends_on:
            - task_key: seed_ing_009_rescue_schema_data
          notebook_task:
            notebook_path: ../../notebooks/02_onboarding/02_onboarding_engine.py
            base_parameters:
              spec_file_path: "${workspace.file_path}/flowx_testing/018_ing_009_rescue_schema.json"
              catalog: flowx
              env: dev
              action_type: CREATE
          environment_key: framework_env

        - task_key: run_ing_009_pipeline
          depends_on:
            - task_key: onboard_ing_009
          pipeline_task:
            pipeline_id: ${resources.pipelines.flowx_test_ing_009_rescue_schema_pipeline.id}

      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../../dist/*.whl
