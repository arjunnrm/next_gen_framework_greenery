# FlowX test scenario 003: "Autoload batch data + reconciliation" -- loads a batch CSV into
# a Bronze table via autoloader, then compares it against scenario 002's Zerobus bronze table
# and appends any records missing from that comparison back into the *Zerobus source bus table
# itself* (not just its bronze copy), so the next Zerobus stream read of that bus picks them up
# as if they had arrived normally -- see
# flowx_testing/003_autoload_recon_append.json's reconciliation_flows[].append_target_table.
#
# v1.5.0: that comparison and append now happen INSIDE THIS PIPELINE'S OWN UPDATE. The old
# wording here -- "via the standalone 05_reconciliation_engine.py job task, not this pipeline --
# reconciliation is not a Lakeflow Declarative Pipeline flow type" -- described the pre-v1.5.0
# architecture and is no longer true. Reconciliation IS now a pipeline flow type: this scenario's
# flow sets execution_mode "pipeline", so 03_lakeflow_declarative_pipeline.py registers its
# L3 prepare / L4 compare / L5 heal datasets alongside the ingestion and transformation flows in
# a single DAG, reading each physical source exactly once. The standalone run_003_reconciliation
# job task has been removed from resources/feature_tests/flowx_test_002_003_job.yml accordingly -- leaving
# it in place would run the comparison twice and double-append.

resources:
  pipelines:
    flowx_test_003_autoload_recon_pipeline:
      name: flowx_test_003_autoload_recon_pipeline_${bundle.target}
      catalog: flowx
      schema: bronze_excalibur
      serverless: true
      photon: true
      development: true
      continuous: false

      libraries:
        - notebook:
            path: ../../notebooks/03_engine/03_lakeflow_declarative_pipeline.py

      environment:
        dependencies:
          - ../../dist/*.whl

      configuration:
        dataflow.group.id: dfg_flowx_003_autoload_recon
        dataflow.control.catalog: flowx
