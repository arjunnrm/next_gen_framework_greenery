# Wraps flowx_test_ing_002_zip_retention_pipeline:
#
#   setup_control_tables -> seed_ing_002_zip_retention_data -> onboard_ing_002 -> run_pipeline_update
#
# Self-contained: seeding is idempotent (the ZIP archive regenerates identically, Delta
# writes are safe to repeat), so this job can be re-run on its own at any time -- each rerun
# re-lands a fresh orders_batch_01.zip into incoming/, even if a prior run already purged it
# (the behavior TC-ING-002 exists to prove).

resources:
  jobs:
    flowx_test_ing_002_zip_retention_job:
      name: FlowX Test ING-002 - ZIP Source Purge Retention Policy

      tasks:
        - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../../notebooks/01_setup/01_setup_control_tables.py
            base_parameters:
              catalog: flowx
          environment_key: framework_env

        - task_key: seed_ing_002_zip_retention_data
          depends_on:
            - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../../notebooks/00_seed_sample_data/03_seed_ing_002_zip_retention_data.py
            base_parameters:
              catalog: flowx
          environment_key: framework_env

        - task_key: onboard_ing_002
          depends_on:
            - task_key: seed_ing_002_zip_retention_data
          notebook_task:
            notebook_path: ../../notebooks/02_onboarding/02_onboarding_engine.py
            base_parameters:
              spec_file_path: "${workspace.file_path}/flowx_testing/011_ing_002_zip_retention.json"
              catalog: flowx
              env: dev
              action_type: CREATE
          environment_key: framework_env

        - task_key: run_pipeline_update
          depends_on:
            - task_key: onboard_ing_002
          pipeline_task:
            pipeline_id: ${resources.pipelines.flowx_test_ing_002_zip_retention_pipeline.id}

      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../../dist/*.whl
