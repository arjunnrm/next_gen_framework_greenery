# Wraps flowx_test_cdc_004_scd2_pipeline:
#
#   setup_control_tables -> seed_cdc_004_scd2_data -> onboard_cdc_004 -> run_pipeline
#
# Self-contained and idempotent (control-table upsert + CREATE ... IF NOT EXISTS schema/volume
# provisioning + idempotent fixture copy), so this job can be re-run on its own at any time.
# See flowx_testing/022_cdc_004_scd2.json and docs/43_tc_cdc_004.md.

resources:
  jobs:
    flowx_test_cdc_004_scd2_job:
      name: FlowX Test CDC-004 - SCD Type 2 Full History & Active Companion View

      tasks:
        - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../../notebooks/01_setup/01_setup_control_tables.py
            base_parameters:
              catalog: flowx
          environment_key: framework_env

        - task_key: seed_cdc_004_scd2_data
          depends_on:
            - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../../notebooks/00_seed_sample_data/03_seed_cdc_004_scd2_data.py
            base_parameters:
              catalog: flowx
          environment_key: framework_env

        - task_key: onboard_cdc_004
          depends_on:
            - task_key: seed_cdc_004_scd2_data
          notebook_task:
            notebook_path: ../../notebooks/02_onboarding/02_onboarding_engine.py
            base_parameters:
              spec_file_path: "${workspace.file_path}/flowx_testing/022_cdc_004_scd2.json"
              catalog: flowx
              env: dev
              action_type: CREATE
          environment_key: framework_env

        - task_key: run_pipeline
          depends_on:
            - task_key: onboard_cdc_004
          pipeline_task:
            pipeline_id: ${resources.pipelines.flowx_test_cdc_004_scd2_pipeline.id}

      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../../dist/*.whl
