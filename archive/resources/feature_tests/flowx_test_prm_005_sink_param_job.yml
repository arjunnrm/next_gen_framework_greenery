# Wraps flowx_test_prm_005_sink_param_pipeline:
#
#   setup_control_tables -> seed_prm_005_sink_param_data -> onboard_prm_005 -> run_pipeline_task
#
# Self-contained: seeds its own dedicated exports_ingest schema/volumes + a per-client
# egress.ACME_CORP Volume fixture (5 small ACME Corp export-staging records) rather than reusing
# any other scenario's fixtures, since no existing seeded table/volume carries this
# client-code-named egress Volume shape. See
# notebooks/00_seed_sample_data/03_seed_prm_005_sink_param_data.py and
# flowx_testing/047_prm_005_sink_param.json.

resources:
  jobs:
    flowx_test_prm_005_sink_param_job:
      name: FlowX Test TC-PRM-005 - Parameterized Egress Sink Paths & Export File Naming

      tasks:
        - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../../notebooks/01_setup/01_setup_control_tables.py
            base_parameters:
              catalog: flowx
          environment_key: framework_env

        - task_key: seed_prm_005_sink_param_data
          depends_on:
            - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../../notebooks/00_seed_sample_data/03_seed_prm_005_sink_param_data.py
            base_parameters:
              catalog: flowx
              client_code: ACME_CORP
              export_tier: GOLD
          environment_key: framework_env

        - task_key: onboard_prm_005
          depends_on:
            - task_key: seed_prm_005_sink_param_data
          notebook_task:
            notebook_path: ../../notebooks/02_onboarding/02_onboarding_engine.py
            base_parameters:
              spec_file_path: "${workspace.file_path}/flowx_testing/047_prm_005_sink_param.json"
              catalog: flowx
              env: dev
              action_type: CREATE
          environment_key: framework_env

        - task_key: run_pipeline_task
          depends_on:
            - task_key: onboard_prm_005
          pipeline_task:
            pipeline_id: ${resources.pipelines.flowx_test_prm_005_sink_param_pipeline.id}

      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../../dist/*.whl
