# This is a Declarative Automation Bundle definition for flowx.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: flowx
  uuid: 26d61e73-4b1b-4755-9b83-f912bf3e623f

# RESOURCE LAYOUT -- resources/ is grouped into one folder per purpose, and every group is
# included here. The grouping is organisational only: DABs still loads all of them into one
# bundle, so a plain `bundle deploy` deploys every group. Scope a deploy with `--select`
# (below), not by editing this list -- a commented-out include silently DESTROYS the
# resources it used to declare on the next deploy, because DABs treats a resource missing
# from the config as one to delete from the target.
#
#   resources/flowx_bootstrap/   the UC containers other resources live in: the
#                                   config/${var.schema}/flowx_sample schemas and the sample
#                                   suite's four Volumes. NOT the catalog -- that is a
#                                   prerequisite, see the group's README.md
#   resources/flowx_app/         the Onboarding App + the UC Volume it stores specs in
#   resources/flowx_config_jobs/ onboarding_job (one spec per run) and
#                                   framework_config_onboarding_job (bulk, a whole dir per run)
#   resources/observability/        DLT observability export job + the OTEL streaming pipeline
#   resources/bt_tests/             tests driven by real BT fixtures/pipelines: geneva tariff
#                                   reconciliation replay, ASN.1 decode, PGP decrypt
#   resources/feature_tests/        the TC-* feature/regression corpus (one job + one pipeline
#                                   per test case) -- see flowx_testing/TESTING_PLAN.md
#   resources/stability_tests/      reserved for flowx_testing/STABILITY_TEST_PLAN.md's
#                                   A1-G4 cases; no resource built yet (see its README.md)
#   resources/sample_jobs/          five flowx_sample reference jobs, one schema-isolated
#                                   sample suite
#   resources/v0_0_2_tests/         the v0.0.2 release test suite (TC1-TC5): one job + one
#                                   pipeline per case, each onboarding its
#                                   flowx_testing/v0_0_2_*.json spec via run_job_task
#                                   against the generic onboarding_job
#
# THE USUAL DEPLOY -- app + both config jobs + wheel, nothing else. `--select` (CLI >= v1.13.0)
# limits the deploy to the named resources; the wheel is still built and uploaded by the
# `artifacts` block below, because the selected jobs depend on it:
#
#   databricks bundle deploy -t dev_flowx -p dev_metaflow \
#     --select apps.flowx_onboarding_app,jobs.onboarding_job,jobs.framework_config_onboarding_job,volumes.onboarding_specs_volume,volumes.framework_wheels_volume
#
# Keep `volumes.onboarding_specs_volume` and `jobs.onboarding_job` in that list even when only
# the app changed: the app resource resolves `${resources.jobs.onboarding_job.id}` into its
# FLOWX_ONBOARDING_JOB_ID env var and binds the spec Volume to its service principal. Keep
# `volumes.framework_wheels_volume` too: every target's `workspace.artifact_path` points into
# that Volume, and selecting it keeps the Volume managed by the same deploy that uploads the
# wheel into it.
include:
  - resources/flowx_bootstrap/*.yml
  - resources/flowx_app/*.yml
  - resources/flowx_config_jobs/*.yml
  - resources/flowx_bi/*.yml
  - resources/uc6/*.yml
#  - resources/observability/*.yml
#  - resources/bt_tests/*.yml
#  - resources/feature_tests/*.yml
#  - resources/stability_tests/*.yml
# - resources/sample_jobs/*.yml
#  - resources/v0_0_2_tests/*.yml

# The framework wheel (a `.whl` -- a ZIP distribution) is built AND published by
# `bundle deploy` itself. There is no separate upload step, and no pinned-path variable to keep
# in sync.
#
#   artifacts.framework_wheel   builds the wheel via scripts/bump_and_build.py
#   workspace.artifact_path     /Volumes/${var.catalog}/config/wheels on every target (v1.6.0).
#                               A UC Volume this bundle itself declares and manages
#                               (resources/flowx_config_jobs/framework_wheels_volume.yml).
#                               `config` is spelled literally, NOT ${var.spec_schema} -- see that
#                               file's header for why. NOTE the ONE-TIME BOOTSTRAP below: the CLI
#                               refuses an artifact_path inside a Volume that does not exist yet.
#   resources/**/*.yml          reference `- ../../dist/*.whl`; DABs rewrites that at deploy time
#                               to the uploaded artifact path (under `<artifact_path>/.internal/`),
#                               for both job `environments` and pipeline `environment.dependencies`.
#
# Why deploy-built-and-published replaced the earlier hand-run `scripts/build_and_upload_wheel.py`
# + pinned `framework_wheel_path` variable: the pin and the upload were two separate manual steps,
# and they drifted. On 2026-08-30 the variable pointed at a wheel that had been built locally but
# never uploaded, so all 86 resources referenced a file that did not exist in the Volume. The
# bundle building and publishing the wheel in one step makes that class of drift impossible.
#
# THE v1.6.0 UC-VOLUME artifact_path DECISION (adopted 2026-09-01). A first UC-Volume
# artifact_path was tried and reverted on 2026-08-30 because its path embedded
# `${workspace.current_user.short_name}`, forking the artifact location by whoever ran the
# deploy. v1.6.0 re-adopts the Volume with a FIXED path and no per-user component: every
# deployer of a target publishes to the same `/Volumes/<catalog>/config/wheels`, which is the
# property that makes a deploy reproducible. That sharing is overwrite-safe -- but NOT
# prune-safe:
#
#   * Overwrite-safe. scripts/bump_and_build.py stamps a unique patch version per deploy, so no
#     deploy can replace another deployer's wheel IN PLACE.
#   * NOT prune-safe -- NEVER DEPLOY WHILE A PIPELINE OR TEST WAVE IS RUNNING. DABs prunes
#     superseded artifacts from `<artifact_path>/.internal/` on a UC Volume exactly as it does
#     in the workspace (verified 2026-08-30: `.internal/` went from two wheels to one across a
#     deploy -- the hoped-for "a Volume never prunes" benefit is FALSE). A deploy issued while a
#     Lakeflow update is installing the previous wheel can therefore still kill that update with
#     ENVIRONMENT_PIP_INSTALL_ERROR, as seen on 2026-08-29 for TC-ING-004/TC-ING-005. The
#     operational rule is the primary mitigation and it is UNCHANGED: never `bundle deploy` while
#     a test wave or pipeline is running (flowx_testing/TESTING_PLAN.md section 0). Two things
#     now back that rule up rather than replacing it:
#
#       ENFORCE IT -- `databricks bundle deploy -t <target> --fail-on-active-runs` refuses the
#       deploy outright if any job or pipeline in the bundle is running, turning the silent
#       mid-run kill into a clean upfront failure. Prefer this on every deploy.
#
#       RECOVER FROM IT -- `python scripts/archive_deployed_wheel.py --profile <profile>`, run
#       AFTER a successful deploy, copies the published wheel into `<artifact_path>/archive/`.
#       DABs does not manage anything outside `.internal/`, so archived wheels are never pruned
#       and stay installable for rollback. NOTE what this does NOT do: deployed resources are
#       pinned to the `.internal/` path, so an archived copy does not repair a pin whose target
#       was pruned mid-install -- recovering means repointing the resource at the archived path
#       by hand. It is a rollback/forensics net, not a substitute for --fail-on-active-runs.
#
# ONE-TIME BOOTSTRAP per workspace. `bundle validate` and `bundle deploy` (verified on CLI
# v1.13.0) REFUSE an artifact_path pointing into a Volume that does not exist yet, even one
# declared in this same bundle: "volume <catalog>.config.wheels does not exist ... Please first
# deploy the volume using 'bundle deploy' and then switch over to using it in the artifact_path".
# DABs does NOT create the Volume before the artifact upload. Since v1.7.4 the workaround is a
# FLAG, NOT A FILE EDIT: every target composes artifact_path from `${var.wheels_root}`, so a
# fresh workspace is bootstrapped by overriding that one variable for a single command
# (`--var="wheels_root=..."`, full recipe under `wheels_root` in the variables block below and
# in docs/onboarding/05_new_workspace_bootstrap.md). Once per workspace; validate prints OK from
# then on. `scripts/bootstrap_workspace.py` runs the whole sequence end to end.
#
# resources/flowx_bootstrap/ (added 2026-09-02) declares the SCHEMAS the Volumes live in, so
# the deploy-order failure that motivated the group is gone for good:
#
#   Error: cannot create resources.volumes.framework_wheels_volume:
#          Schema 'flowx.config' does not exist
#
# DABs rewrites each Volume's schema_name into ${resources.schemas.config_schema.name} -- a real
# dependency edge -- so schema-before-volume is enforced by DABs itself, not by convention.
#
# THE CATALOG IS NOT DECLARED, AND CANNOT BE. ${var.catalog} is a PREREQUISITE created once per
# workspace in the UI. A catalogs.* resource was tried on 2026-09-02 and removed the same day:
# these accounts use UC Default Storage, so CREATE CATALOG without a MANAGED LOCATION is rejected
# ("Metastore storage root URL does not exist ... 400 INVALID_STATE"), and a Default-Storage
# catalog's storage_root is an account-managed bucket path with generated UUIDs that cannot be
# committed to YAML. Worse, the failing catalog propagated DOWN the dependency edge and took the
# schemas with it ("cannot create resources.schemas.config_schema: dependency failed"). See
# resources/flowx_bootstrap/README.md; a unit test keeps it undeclared.
#
# The artifact_path pre-check is a SEPARATE mechanism from resource-creation order, and it still
# fires: it runs during config resolution, BEFORE any resource is created, so a Volume declared
# in this same bundle does not satisfy it (re-verified on CLI v1.13.0 against `arjun_2` on
# 2026-09-02 with the schema resources in place -- "Error: volume flowx.config.wheels does not
# exist at workspace.artifact_path"). The one-time sequence on a fresh workspace is:
#
#   0. create the catalog in the UI (Catalog -> Create catalog -> Default storage)
#   1. databricks bundle deploy -t <target> -p <profile>
#        --select schemas.config_schema,volumes.framework_wheels_volume
#        --var="wheels_root=/Workspace/Users/<you>/.bundle/flowx/<target>/artifacts"
#   2. databricks bundle deploy -t <target> -p <profile>      # normal, no --var
#
# Step 1 overrides wheels_root away from the Volume for that ONE command, so the pre-check has
# nothing to reject while the Volume is being created; step 2 uses the default and lands in it.
# No file is edited, so there is no half-finished edit to commit by mistake.
# `python scripts/bootstrap_workspace.py -t <target> -p <profile>` does both steps for you.
#
# COMPLETED for `arjun_2` on 2026-09-02: catalog pre-existed, schemas config/dev/flowx_sample
# and all six Volumes created by this bundle, artifact_path restored below, full deploy green.
#
# LIVE CAVEAT for the `dev` target: its workspace's metastore is at its 50-Volume ceiling
# ("Cannot create 1 Volume(s) ... estimated count: 52, limit: 50") and its catalog at 51
# schemas, so creating `framework_wheels_volume` there may fail outright. Deploys from this
# machine target `dev_flowx` anyway; free a Volume slot before deploying `dev`.
#
# Wheels published by the older manual script live directly in the Volume root, OUTSIDE
# `.internal/`, so DABs does not manage or prune them; they remain installable for any pipeline
# still pinned to one.
#
#   databricks bundle deploy --target <target> -p <profile>

artifacts:
  framework_wheel:
    type: whl
    path: .
    # scripts/bump_and_build.py -- NOT a bare `uv build --wheel`. It archives any wheel already
    # in dist/ (so the `../../dist/*.whl` glob in resources/**/*.yml only ever matches ONE file) and
    # stamps pyproject.toml's patch version to UTC epoch-millis, so every deploy produces a
    # uniquely-named wheel. That uniqueness is what stops a redeploy replacing the exact file a
    # running pipeline is installing. `dynamic_version: true` is deliberately NOT used instead:
    # it is applied to job `environments` but NOT to pipeline `environment.dependencies`, so
    # pipelines would have kept resolving a stable filename that each deploy overwrote in place.
    build: python scripts/bump_and_build.py

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  framework_version:
    description: >-
      The framework wheel's 3-part semantic version (X.Y.Z), which MUST equal `version` in
      pyproject.toml -- scripts/bump_and_build.py reads that file and refuses an epoch-stamped
      value. It is the last path segment of `workspace.artifact_path`
      (/Volumes/<catalog>/config/wheels/<framework_version>), which is what makes one release's
      wheel deploy unable to disturb another's: `bundle deploy` PRUNES superseded artifacts from
      `<artifact_path>/.internal/`, so while every release shared one flat directory, deploying a
      new version deleted the wheel that a still-running pipeline from the previous version was
      resolving (ENVIRONMENT_PIP_INSTALL_ERROR). Per-version directories make that structurally
      impossible rather than merely unlikely -- unique wheel FILENAMES never prevented it, because
      pruning removes by directory scan, not by name collision. Bump this and pyproject.toml
      together, in the same commit.
    default: 0.0.3
  wheels_root:
    description: >-
      Parent directory of the version-scoped wheel artifact path; every target composes
      `workspace.artifact_path` as `${var.wheels_root}/${var.framework_version}`.

      IT EXISTS TO MAKE THE ONE-TIME FRESH-WORKSPACE BOOTSTRAP A FLAG, NOT A FILE EDIT.
      `bundle validate`/`deploy` refuse an artifact_path inside a UC Volume that does not exist
      yet -- that check runs during config resolution, BEFORE any resource is created, so the
      `volumes.framework_wheels_volume` declared in this very bundle cannot satisfy it. The old
      workaround was to comment out each target's `artifact_path:` line, deploy, then uncomment
      it: three manual edits to a shared file, easy to half-finish and easy to commit by mistake.
      Now the bootstrap overrides this variable for exactly one command and touches no file:

        databricks bundle deploy -t <target> -p <profile>           --select schemas.config_schema,volumes.framework_wheels_volume           --var="wheels_root=/Workspace/Users/$(whoami)/.bundle/flowx/<target>/artifacts"

      then deploy normally -- the default below points back into the Volume the step above just
      created. Overriding this in day-to-day use is NOT supported: the fixed, shared Volume path
      is what makes a deploy reproducible regardless of who runs it (see the v1.6.0 decision
      record above). See docs/onboarding/05_new_workspace_bootstrap.md.
    default: /Volumes/${var.catalog}/config/wheels
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  spec_schema:
    description: >-
      Schema holding the UC Volume that the FlowX Onboarding App reads and writes
      authored onboarding specs to. Defaults to `config`, the framework's existing
      configuration schema, deliberately: creating a NEW schema per target is what the
      `dev` target cannot afford (its catalog is at 51 schemas and its metastore at its
      50-Volume ceiling — see the artifact_path note above). Override per target if the
      specs should live elsewhere.
    default: config
  spec_volume:
    description: >-
      Volume under ${var.catalog}.${var.spec_schema} holding authored onboarding specs.
      resources/flowx_app/flowx_onboarding_specs_volume.yml creates it; the app resource grants
      its service principal WRITE_VOLUME on it at deploy time.
    default: onboarding_specs
  dashboard_warehouse_id:
    description: >-
      SQL warehouse that backs the AI/BI control-metadata dashboard
      (resources/flowx_bi/flowx_control_dashboard.yml). A dashboard resource requires a
      warehouse id and there is no portable default -- warehouse ids are per workspace -- so
      each target sets its own. Find it with `databricks warehouses list -p <profile>`.
  dataflow_group_id:
    description: >-
      The metadata-driven dataflow_group_id the sample Lakeflow pipeline resource
      (resources/lakeflow_metadata_pipeline.yml) is configured to run. Defaults to the
      unified dual-engine demo (spec_06); override with
      `databricks bundle deploy --var="dataflow_group_id=dfg_finance_txn_ingest"` to point
      the pipeline at a different test_specs/*.json scenario after onboarding it.
    default: dfg_iot_telemetry_unified

targets:
  dev_flowx:
    # NO `mode: development` -- deliberate, and the reason is the artifact_path below.
    #
    # DABs rejects a `mode: development` target whose `artifact_path` does not contain the
    # deploying user's name: "artifact_path should contain the current username or
    # ${workspace.current_user.short_name} to ensure uniqueness when using 'mode: development'".
    # That is exactly the per-user fork the v1.6.0 decision above REVERSED on 2026-08-30 -- the
    # fixed, shared `/Volumes/<catalog>/config/wheels` path is the property that makes a deploy
    # reproducible regardless of who runs it, and re-adding a `${...short_name}` component to
    # satisfy the check would undo it.
    #
    # WHY THIS ONLY SURFACED ON THE v3 WORKSPACE. On the previous workspace the deploying user
    # was `flowx@nrmanalytix.com`, whose short_name is literally `flowx` -- and the path
    # `/Volumes/flowx/config/wheels` contains it. The check passed by pure coincidence
    # between the catalog name and that user's name. On this workspace the user is
    # `flowx_v3@nrmanalytix.com`, the coincidence is gone, and the check fires.
    #
    # WHAT DROPPING development MODE COSTS: deployed resources keep their literal names (no
    # `[dev <user>]` prefix) and job schedules/triggers are no longer auto-paused. Nothing in
    # this bundle declares a schedule, so the second point is inert today -- but it is the thing
    # to re-check before adding one.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    default: true
    workspace:
      host: https://dbc-8bb5bedf-1a4b.cloud.databricks.com
      profile: dev_metaflow
      # v1.6.0: fixed, shared UC-Volume artifact path -- see the `artifacts` block above for the
      # decision record and the never-deploy-mid-run rule that still applies.
      artifact_path: ${var.wheels_root}/${var.framework_version}

    variables:
      catalog: flowx
      schema: dev
      dashboard_warehouse_id: f9e5f492103a22ad


  arjun_2:
    workspace:
      host: https://dbc-31ca4b8a-2670.cloud.databricks.com/
      profile: arjun_2
      # v1.6.0: fixed, shared UC-Volume artifact path -- see the `artifacts` block above for the
      # decision record and the never-deploy-mid-run rule that still applies.
      artifact_path: ${var.wheels_root}/${var.framework_version}

    variables:
      catalog: flowx
      schema: dev
      dashboard_warehouse_id: 2f404c0e2017eab7

  arjun_3:
    workspace:
      host: https://dbc-54bb898c-098c.cloud.databricks.com/
      profile: arjun_3
      # v1.6.0: fixed, shared UC-Volume artifact path -- see the `artifacts` block above for the
      # decision record and the never-deploy-mid-run rule that still applies.
      artifact_path: ${var.wheels_root}/${var.framework_version}

    variables:
      catalog: flowx
      schema: dev
      dashboard_warehouse_id: 2f404c0e2017eab7

  hoonartek:
    workspace:
      host: https://8259560580035702.2.gcp.databricks.com/
      profile: hoonartek
      # v1.6.0: fixed, shared UC-Volume artifact path -- see the `artifacts` block above for the
      # decision record and the never-deploy-mid-run rule that still applies.
      artifact_path: ${var.wheels_root}/${var.framework_version}

    variables:
      catalog: flowx
      schema: dev
      dashboard_warehouse_id: fe7871113e044faa

  metaflow_v7:
    workspace:
      host: https://dbc-bc553b65-f05f.cloud.databricks.com/
      profile: metaflow_v7
      # v1.6.0: fixed, shared UC-Volume artifact path -- see the `artifacts` block above for the
      # decision record and the never-deploy-mid-run rule that still applies.
