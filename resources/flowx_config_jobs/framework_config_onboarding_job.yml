# Generic framework config-onboarding job: onboards an ENTIRE DIRECTORY of onboarding specs
# in a single run, driven by job parameters.
#
# Relationship to the two neighbouring onboarding resources:
#   * resources/flowx_config_jobs/onboarding_job.yml       -- one spec per run  (`spec_file_path`)
#   * THIS FILE                          -- a whole directory per run (`spec_dir`)
#   * each flowx_test_*_job.yml       -- pins its own single spec inline, for that one test
#
# It is a first-class framework resource, not a test fixture: `spec_dir` defaults to this
# bundle's `flowx_testing/` corpus purely because that is the directory most often
# onboarded wholesale, but pointing it at any other folder of specs (a customer's own
# onboarding directory, a UC Volume of specs promoted from a lower environment) needs nothing
# but a different `--params spec_dir=...`.
#
# Usage:
#   databricks bundle run framework_config_onboarding_job --target dev
#   databricks bundle run framework_config_onboarding_job --target dev \
#     --params spec_dir=/Volumes/flowx/config/specs,action_type=UPDATE,fail_fast=true
#
# `exclude_specs` skips deliberate negative-test specs -- `048_prm_006_negative_param.json`
# exists precisely to FAIL validation (TC-PRM-006), so counting it as a failure would make a
# healthy run look broken. Excluding it here is a reporting decision, not a coverage gap: that
# spec's expected-failure behavior is asserted by its own dedicated job,
# flowx_test_prm_006_negative_param_job.
#
# Tagged `purpose: testing` per the release process, so every resource this release adds for
# framework verification is discoverable by tag in the Jobs UI and in billing/usage system
# tables (system.billing.usage exposes job tags), letting test compute be costed separately
# from production workloads.

resources:
  jobs:
    framework_config_onboarding_job:
      name: FlowX Framework - Bulk Config Onboarding (All Specs)
      description: >-
        Onboards every onboarding spec in `spec_dir` in one run (fail-soft, full per-spec
        report). Generic: point it at any directory of JSON/YAML onboarding specs.

      tags:
        purpose: testing
        framework: flowx
        component: onboarding
        release: v1.3.0

      parameters:
        - name: spec_dir
          default: ${workspace.file_path}/flowx_testing
        - name: catalog
          default: flowx
        - name: env
          default: ${bundle.target}
        - name: action_type
          default: CREATE
        - name: fail_fast
          default: "false"
        - name: exclude_specs
          default: 048_prm_006_negative_param.json

      tasks:
        # Control tables first: the bulk notebook self-provisions them too (via
        # ensure_control_schema_exists), but running the canonical setup notebook up front
        # keeps this job usable as the single entrypoint for bringing up a brand-new catalog.
        - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../../notebooks/01_setup/01_setup_control_tables.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
          environment_key: framework_env

        - task_key: bulk_onboard_specs
          depends_on:
            - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../../notebooks/02_onboarding/02b_bulk_config_onboarding_engine.py
            base_parameters:
              spec_dir: "{{job.parameters.spec_dir}}"
              catalog: "{{job.parameters.catalog}}"
              env: "{{job.parameters.env}}"
              action_type: "{{job.parameters.action_type}}"
              fail_fast: "{{job.parameters.fail_fast}}"
              exclude_specs: "{{job.parameters.exclude_specs}}"
          environment_key: framework_env

      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../../dist/*.whl
