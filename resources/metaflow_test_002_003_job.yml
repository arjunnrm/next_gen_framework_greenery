# Wraps both metaflow_test_002_zerobus_pipeline and metaflow_test_003_autoload_recon_pipeline
# in one job, since scenario 003 depends on scenario 002's own output (its reconciliation flow
# compares against metaflow.bronze_excalibur.zerobus_bronze, which 002's pipeline produces):
#
#   setup_control_tables -> seed_metaflow_testing_data
#     -> onboard_002 -> run_002_pipeline
#       -> onboard_003 -> run_003_pipeline
#
# v1.5.0 / TC-R2-001 (Module 12): scenario 003's reconciliation flow
# (recon_excalibur_autoload_vs_zerobus) now sets execution_mode: "pipeline" and
# dataflow_group_id: dfg_metaflow_003_autoload_recon, so its L3 (prepare) / L4 (compare) / L5
# (heal) datasets and append-back flow are registered INSIDE run_003_pipeline's own Lakeflow
# update instead of running as a standalone job task -- there is no run_003_reconciliation task
# any more. It still appends any records present in scenario 003's autoload_bronze but missing
# from scenario 002's zerobus_bronze back into metaflow.Excalibur_usecase.zerobus_source_bus
# (the Zerobus SOURCE bus table itself, not just its bronze copy) -- so a subsequent run of
# metaflow_test_002_zerobus_pipeline's Zerobus stream picks those records up as if they had
# arrived normally -- via the pipeline's own foreach_batch_sink heal handler now, not the
# standalone 05_reconciliation_engine.py notebook. See
# metaflow_testing/003_autoload_recon_append.json and metaflow_testing/TESTING_PLAN.md's
# TC-R2-001 row.

resources:
  jobs:
    metaflow_test_002_003_job:
      name: Metaflow Test 002-003 - Zerobus + Autoload Reconciliation

      tasks:
        - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../notebooks/01_setup/01_setup_control_tables.py
            base_parameters:
              catalog: metaflow
          environment_key: framework_env

        - task_key: seed_metaflow_testing_data
          depends_on:
            - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../notebooks/00_seed_sample_data/02_seed_metaflow_testing_data.py
            base_parameters:
              catalog: metaflow
          environment_key: framework_env

        - task_key: onboard_002
          depends_on:
            - task_key: seed_metaflow_testing_data
          notebook_task:
            notebook_path: ../notebooks/02_onboarding/02_onboarding_engine.py
            base_parameters:
              spec_file_path: "${workspace.file_path}/metaflow_testing/002_zerobus_data_load.json"
              catalog: metaflow
              env: dev
              action_type: CREATE
          environment_key: framework_env

        - task_key: run_002_pipeline
          depends_on:
            - task_key: onboard_002
          pipeline_task:
            pipeline_id: ${resources.pipelines.metaflow_test_002_zerobus_pipeline.id}

        - task_key: onboard_003
          depends_on:
            - task_key: run_002_pipeline
          notebook_task:
            notebook_path: ../notebooks/02_onboarding/02_onboarding_engine.py
            base_parameters:
              spec_file_path: "${workspace.file_path}/metaflow_testing/003_autoload_recon_append.json"
              catalog: metaflow
              env: dev
              action_type: CREATE
          environment_key: framework_env

        - task_key: run_003_pipeline
          depends_on:
            - task_key: onboard_003
          pipeline_task:
            pipeline_id: ${resources.pipelines.metaflow_test_003_autoload_recon_pipeline.id}

      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl
