# Sample 02 -- Glob-Filtered ZIP Ingestion with Quarantine DQ (reference, not a test):
# source_zip_handling extracts only sample_orders_*.zip from the incoming Volume and Auto Loader
# ingests the contained CSV into an APPEND streaming table, with 3 deliberately broken rows
# (NULL customer_id) per seeded iteration routed to sample_zip_orders_raw_quarantine by the
# quarantine DQ rule. Everything isolated in the metaflow.metaflow_sample schema.
#
#   setup_control_tables -> onboard_sample_02 -> run_pipeline -> store_sample_config
#
# SEED FIRST. This job lands no data of its own. Its fixtures come from the suite-wide
# resources/sample_jobs/metaflow_sample_seed_job.yml (tasks seed_sample_02_iteration1..3), which
# must have completed at least once:
#
#   databricks bundle run metaflow_sample_seed_job            -t dev_metaflow -p dev_metaflow
#   databricks bundle run metaflow_sample_02_zip_ingestion_job -t dev_metaflow -p dev_metaflow
#
# The seed builds ONE ZIP archive per iteration IN-PROCESS (never a pre-built .zip fixture --
# bundle sync mangles binary uploads) from a distinct samples.tpch.orders slice. All three
# archives are on disk before this job runs, so the single pipeline update below extracts and
# ingests all three at once: 90 clean rows in sample_zip_orders_raw and 9 in
# sample_zip_orders_raw_quarantine.
#
# Onboarding is DELEGATED to the generic onboarding_job
# (resources/metaflow_config_jobs/onboarding_job.yml) via run_job_task -- never an inline
# 02_onboarding_engine.py notebook_task. Self-contained and idempotent, so this job can be
# re-run on its own at any time. See metaflow_testing/samples/sample_02_zip_ingestion.json.

resources:
  jobs:
    metaflow_sample_02_zip_ingestion_job:
      name: Metaflow Sample 02 - Glob-Filtered ZIP Ingestion with Quarantine DQ

      tasks:
        - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../../notebooks/01_setup/01_setup_control_tables.py
            base_parameters:
              catalog: metaflow
          environment_key: framework_env

        - task_key: onboard_sample_02
          depends_on:
            - task_key: setup_control_tables
          run_job_task:
            job_id: ${resources.jobs.onboarding_job.id}
            job_parameters:
              spec_file_path: "${workspace.file_path}/metaflow_testing/samples/sample_02_zip_ingestion.json"
              catalog: metaflow
              env: dev
              action_type: CREATE

        - task_key: run_pipeline
          depends_on:
            - task_key: onboard_sample_02
          pipeline_task:
            pipeline_id: ${resources.pipelines.metaflow_sample_02_zip_ingestion_pipeline.id}

        # Publishes this job's onboarding spec into the developer-reference Volume
        # /Volumes/metaflow/metaflow_sample/sample_configs/ -- the last task of every sample job.
        - task_key: store_sample_config
          depends_on:
            - task_key: run_pipeline
          notebook_task:
            notebook_path: ../../notebooks/09_sample_reference/09a_store_sample_config.py
            base_parameters:
              spec_paths: "${workspace.file_path}/metaflow_testing/samples/sample_02_zip_ingestion.json"
              catalog: metaflow
          environment_key: framework_env

      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../../dist/*.whl
