# Sample 05 -- Encrypted ZIP Ingestion via UC Secret Passphrase (reference, not a test): at
# pipeline runtime, source_zip_handling.pre_extraction_decryption.secret_passphrase resolves the
# UC secret Sample 04's export side also uses, and decrypts/extracts each AES-256
# password-protected archive before Auto Loader ingests the contained CSV. Everything isolated
# in the metaflow.metaflow_sample schema.
#
#   setup_control_tables -> onboard_sample_05 -> run_pipeline -> store_sample_config
#
# SEED FIRST. This job lands no data of its own. Its fixtures come from the suite-wide
# resources/sample_jobs/metaflow_sample_seed_job.yml (tasks seed_sample_05_iteration1..3), which
# must have completed at least once:
#
#   databricks bundle run metaflow_sample_seed_job                  -t dev_metaflow -p dev_metaflow
#   databricks bundle run metaflow_sample_05_encrypted_ingestion_job -t dev_metaflow -p dev_metaflow
#
# The seed builds ONE AES-256 password-protected ZIP per iteration IN-PROCESS with pyzipper
# (never a pre-built binary fixture) from a distinct samples.tpch.orders-derived transaction
# slice. All three archives are on disk before this job runs, so the single pipeline update
# below decrypts and ingests all three at once.
#
# MANUAL PREREQUISITE (one-time, admin-audited, external to this bundle -- mirroring
# resources/bt_tests/metaflow_test_ing_005_pgp_decrypt_job.yml's documented-prerequisite
# pattern): the Unity Catalog secret metaflow.metaflow_sample.sample_zip_passkey must already
# exist before the seed job's Sample 05 chain runs -- unlike Sample 04, the SEED itself needs
# the passphrase to BUILD the encrypted archives, so it resolves the secret first thing and
# fails fast with a clear message if it is unresolvable (it also round-trip-verifies each
# archive it builds with that same passphrase). Provision the secret once and both Sample 04 and
# Sample 05 work. See metaflow_testing/README.md's "Sample reference suite" section for the
# provisioning command.
#
# Onboarding is DELEGATED to the generic onboarding_job
# (resources/metaflow_config_jobs/onboarding_job.yml) via run_job_task -- never an inline
# 02_onboarding_engine.py notebook_task. Self-contained and idempotent, so this job can be
# re-run on its own at any time. See
# metaflow_testing/samples/sample_05_encrypted_ingestion.json.

resources:
  jobs:
    metaflow_sample_05_encrypted_ingestion_job:
      name: Metaflow Sample 05 - Encrypted ZIP Ingestion via UC Secret Passphrase

      tasks:
        - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../../notebooks/01_setup/01_setup_control_tables.py
            base_parameters:
              catalog: metaflow
          environment_key: framework_env

        - task_key: onboard_sample_05
          depends_on:
            - task_key: setup_control_tables
          run_job_task:
            job_id: ${resources.jobs.onboarding_job.id}
            job_parameters:
              spec_file_path: "${workspace.file_path}/metaflow_testing/samples/sample_05_encrypted_ingestion.json"
              catalog: metaflow
              env: dev
              action_type: CREATE

        - task_key: run_pipeline
          depends_on:
            - task_key: onboard_sample_05
          pipeline_task:
            pipeline_id: ${resources.pipelines.metaflow_sample_05_encrypted_ingestion_pipeline.id}

        # Publishes this job's onboarding spec into the developer-reference Volume
        # /Volumes/metaflow/metaflow_sample/sample_configs/ -- the last task of every sample job.
        - task_key: store_sample_config
          depends_on:
            - task_key: run_pipeline
          notebook_task:
            notebook_path: ../../notebooks/09_sample_reference/09a_store_sample_config.py
            base_parameters:
              spec_paths: "${workspace.file_path}/metaflow_testing/samples/sample_05_encrypted_ingestion.json"
              catalog: metaflow
          environment_key: framework_env

      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../../dist/*.whl
