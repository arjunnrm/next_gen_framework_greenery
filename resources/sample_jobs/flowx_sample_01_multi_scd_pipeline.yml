# Sample 01 -- "Multi-Strategy SCD Dimensions" (reference, not a test): one unified Lakeflow
# Declarative Pipeline hosting all four of dfg_sample_01_multi_scd's flows -- SCD1 customers,
# SCD2 suppliers, FULL_SNAPSHOT_CDC parts (strictly additive iterations -- see the job header),
# an APPEND order-events feed, and the SCD3 transformation joining order events (stream side)
# to the SCD1 customer dimension (static side). Every asset publishes into the single
# flowx.flowx_sample schema. See resources/sample_jobs/onboarding/sample_01_multi_scd.json and
# resources/sample_jobs/flowx_sample_01_multi_scd_job.yml.

resources:
  pipelines:
    flowx_sample_01_multi_scd_pipeline:
      name: flowx_sample_01_multi_scd_pipeline_${bundle.target}
      catalog: flowx
      schema: flowx_sample
      serverless: true
      photon: true
      development: true
      continuous: false

      libraries:
        - notebook:
            path: ../../notebooks/03_engine/03_lakeflow_declarative_pipeline.py

      environment:
        dependencies:
          - ../../dist/*.whl

      configuration:
        dataflow.group.id: dfg_sample_01_multi_scd
        dataflow.control.catalog: flowx
