# Sample 01 -- Multi-Strategy SCD Dimension Suite (reference, not a test): SCD1 + SCD2 +
# FULL_SNAPSHOT_CDC ingestion plus an SCD3 transformation joining two of the group's own
# tables, everything isolated in the metaflow.metaflow_sample schema.
#
#
# SEED FIRST. This job lands no data of its own. Its fixtures come from the suite-wide
# resources/sample_jobs/metaflow_sample_seed_job.yml (tasks seed_sample_01_iteration1..3), which
# must have completed at least once:
#
#   databricks bundle run metaflow_sample_seed_job         -t dev_metaflow -p dev_metaflow
#   databricks bundle run metaflow_sample_01_multi_scd_job -t dev_metaflow -p dev_metaflow
#
# Iteration narrative (see notebooks/00_seed_sample_data/04_seed_sample_01_multi_scd_data.py):
# iteration 2 mutates values for existing SCD1/SCD2 keys (in-place overwrite vs. a new history
# version), iteration 3 adds new keys plus further changes, and every iteration advances the
# same 20 orders one status step (OPENED -> PROCESSING -> FULFILLED) so the SCD3
# current/previous pivot is visible. With all three iterations seeded before this job runs, the
# single pipeline update below ingests them together -- `apply_changes` still sequences the
# versions within that one batch, so SCD2 history is built exactly as before; what is no longer
# observable is the update-by-update progression. To watch it evolve instead, run the seed
# job's Sample 01 chain one iteration at a time with this pipeline in between.
#
# HARD CONSTRAINT (observed live, see agent_skills/reference/common_pitfalls.md and the spec's
# _sample_note): apply_changes_from_snapshot's snapshot-input dataset ACCUMULATES over a
# streaming Auto Loader upstream -- multi-snapshot diffing does NOT delete removed keys, and a
# re-landed existing key would appear twice in one accumulated snapshot. The FULL_SNAPSHOT_CDC
# parts feed is therefore strictly ADDITIVE across the 3 seeded iterations: new part keys only,
# never a changed or removed existing key.
#
# The spec also onboards a triggered DATABRICKS_VOLUME observability destination
# (/Volumes/metaflow/metaflow_sample/observability/sample_01_multi_scd/). This job deliberately
# adds no observability export task of its own -- see Sample 03
# (resources/sample_jobs/metaflow_sample_03_multi_table_recon_job.yml) for the export-task
# wiring, which applies here verbatim if wanted.
#
# Onboarding is DELEGATED to the generic onboarding_job
# (resources/metaflow_config_jobs/onboarding_job.yml) via run_job_task -- never an inline
# 02_onboarding_engine.py notebook_task. Self-contained and idempotent (control-table upsert +
# CREATE ... IF NOT EXISTS provisioning), so this job can be re-run on its own at any time. See
# resources/sample_jobs/onboarding/sample_01_multi_scd.json.

# ---------------------------------------------------------------------------------------------
# DEVELOPER BLUEPRINT -- the 2-task sample template. Clone this file.
#
#   pipeline_task       runs the Lakeflow pipeline (the transformation logic)
#   observability_task  exports telemetry, DQ results and execution metrics for that update
#
# THAT IS THE WHOLE JOB. Provisioning is deliberately NOT here. Control-table setup, spec
# onboarding and fixture seeding all live in the ONE suite-wide provisioning job,
# resources/sample_jobs/metaflow_sample_seed_job.yml, which must have run at least once:
#
#   databricks bundle run metaflow_sample_seed_job -t <target> -p <profile>   # once
#   databricks bundle run metaflow_sample_01_multi_scd_job -t <target> -p <profile>
#
# WHY ONBOARDING MOVED OUT. `pipeline_task` reads its configuration from the control tables;
# a group that was never onboarded fails in repository.py with
# `FrameworkConfigError: No active dataflow_group_spec row found for dataflow_group_id=...`.
# Onboarding is provisioning -- the same category as seeding -- so it is done once by the seed
# job for all six samples, not re-done on every developer run.
#
# The onboarding spec for this sample lives in the bundle at
# resources/sample_jobs/onboarding/sample_01_multi_scd.json
# ---------------------------------------------------------------------------------------------

resources:
  jobs:
    metaflow_sample_01_multi_scd_job:
      name: Metaflow Sample 01 - Multi-Strategy SCD Dimensions (SCD1 + SCD2 + Snapshot CDC + SCD3)

      tasks:
        # 1/2 -- core pipeline / transformation logic.
        - task_key: pipeline_task
          pipeline_task:
            pipeline_id: ${resources.pipelines.metaflow_sample_01_multi_scd_pipeline.id}

        # 2/2 -- telemetry, data-quality validation and execution monitoring for the update
        # `pipeline_task` just completed. All four base_parameters below are REQUIRED -- see
        # resources/observability/dlt_observability_job.yml's PARAMETER CONTRACT note.
        - task_key: observability_task
          depends_on:
            - task_key: pipeline_task
          notebook_task:
            notebook_path: ../../notebooks/08_observability/08_dlt_observability_engine.py
            base_parameters:
              dataflow_group_id: dfg_sample_01_multi_scd
              catalog: metaflow
              env: dev
              pipeline_task_run_id: "{{tasks.pipeline_task.run_id}}"
              service_name: dlt-observability-metaflow-sample-01
              fail_task_on_dispatch_error: "true"
          environment_key: framework_env

      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../../dist/*.whl
