# Sample 03 -- Concurrent Multi-Table Load + In-DAG Reconciliation (reference, not a test):
# two Auto Loader flows load primary/replica NYC-taxi trip tables concurrently inside ONE
# pipeline update, and a reconciliation flow (execution_mode 'pipeline_audit_only') compares
# them in the same Lakeflow DAG -- classified/metrics/mismatch datasets published to
# metaflow.metaflow_sample, healing left to the standalone job engine. Everything isolated in
# the metaflow.metaflow_sample schema.
#
#   setup_control_tables -> onboard_sample_03 -> run_pipeline -> observability_export
#     -> store_sample_config
#
# SEED FIRST. This job lands no data of its own. Its fixtures come from the suite-wide
# resources/sample_jobs/metaflow_sample_seed_job.yml (tasks seed_sample_03_iteration1..3), which
# must have completed at least once:
#
#   databricks bundle run metaflow_sample_seed_job                 -t dev_metaflow -p dev_metaflow
#   databricks bundle run metaflow_sample_03_multi_table_recon_job -t dev_metaflow -p dev_metaflow
#
# Controlled drift (each seeded iteration lands a fresh 40-row slice; both tables are APPEND, so
# the reconciliation compares the CUMULATIVE tables):
#   iteration 1: replica identical to primary        -> contributes 0 drift, 0 missing
#   iteration 2: 6 replica rows get fare_amount +5.0 -> contributes 6 VALUE_DRIFT rows
#   iteration 3: 8 replica rows omitted entirely     -> contributes 8 genuinely missing rows
# With all three iterations seeded before this job runs, the single pipeline update below sees
# the fully-drifted state directly: value_drift_count 6 and missing_in_target_count 14 (6 drift
# + 8 missing -- missing_in_target_count counts VALUE_DRIFT rows too). The recon flow's
# dq_config warn-rules (missing_in_target_count = 0, value_drift_count = 0) therefore WARN, by
# design, on that update. To watch the counters step 0 -> 6 -> 14 instead, run the seed job's
# Sample 03 chain one iteration at a time with this pipeline in between.
#
# observability_export runs the triggered DLT observability engine against the spec's
# DATABRICKS_VOLUME destination and lands run_log/mismatch/result rows in the metaflow.config
# control tables -- the same 4-parameter contract as
# resources/feature_tests/metaflow_test_dag_001_unified_job.yml / resources/observability/
# dlt_observability_job.yml (observability export stays a separate job task, never a step baked
# into the pipeline itself).
#
# Onboarding is DELEGATED to the generic onboarding_job
# (resources/metaflow_config_jobs/onboarding_job.yml) via run_job_task -- never an inline
# 02_onboarding_engine.py notebook_task. Self-contained and idempotent, so this job can be
# re-run on its own at any time. See metaflow_testing/samples/sample_03_multi_table_recon.json.

resources:
  jobs:
    metaflow_sample_03_multi_table_recon_job:
      name: Metaflow Sample 03 - Concurrent Multi-Table Load with In-DAG Reconciliation

      tasks:
        - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../../notebooks/01_setup/01_setup_control_tables.py
            base_parameters:
              catalog: metaflow
          environment_key: framework_env

        - task_key: onboard_sample_03
          depends_on:
            - task_key: setup_control_tables
          run_job_task:
            job_id: ${resources.jobs.onboarding_job.id}
            job_parameters:
              spec_file_path: "${workspace.file_path}/metaflow_testing/samples/sample_03_multi_table_recon.json"
              catalog: metaflow
              env: dev
              action_type: CREATE

        - task_key: run_pipeline
          depends_on:
            - task_key: onboard_sample_03
          pipeline_task:
            pipeline_id: ${resources.pipelines.metaflow_sample_03_multi_table_recon_pipeline.id}

        - task_key: observability_export
          depends_on:
            - task_key: run_pipeline
          notebook_task:
            notebook_path: ../../notebooks/08_observability/08_dlt_observability_engine.py
            base_parameters:
              # All four are REQUIRED -- see resources/observability/dlt_observability_job.yml's
              # PARAMETER CONTRACT note. pipeline_task_run_id points at the pipeline update this
              # run just completed, so the export covers the fully-drifted state.
              dataflow_group_id: dfg_sample_03_multi_table_recon
              catalog: metaflow
              env: dev
              pipeline_task_run_id: "{{tasks.run_pipeline.run_id}}"
              service_name: dlt-observability-metaflow-sample-03
              fail_task_on_dispatch_error: "true"
          environment_key: framework_env

        # Publishes this job's onboarding spec into the developer-reference Volume
        # /Volumes/metaflow/metaflow_sample/sample_configs/ -- the last task of every sample job.
        - task_key: store_sample_config
          depends_on:
            - task_key: observability_export
          notebook_task:
            notebook_path: ../../notebooks/09_sample_reference/09a_store_sample_config.py
            base_parameters:
              spec_paths: "${workspace.file_path}/metaflow_testing/samples/sample_03_multi_table_recon.json"
              catalog: metaflow
          environment_key: framework_env

      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../../dist/*.whl
