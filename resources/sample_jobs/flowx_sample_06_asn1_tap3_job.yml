# Sample 06 -- Real GSMA TAP3 ASN.1 BER Ingestion (reference, not a test): the framework's
# `source_type: "asn1"` path driven by the genuine GSMA TAP release 3.10 specification shipped
# in this repo at flowx_testing/BT_Testing/TAP.310.asn1 -- 1597 lines, 375 types -- rather
# than a hand-written toy module (contrast flowx_testing/013_ing_004_asn1_decode.json, whose
# 5-field sample_data/asn1_schema/gsm_cdr.asn exists only for TC-ING-004). Auto Loader reads
# the .ber payloads as binaryFile and asn1/decoder.py's mapInPandas transform decodes each one
# into structured columns. Everything is isolated in the flowx.flowx_sample schema.
#
#
# SEED FIRST. This job lands no data of its own. Its fixtures come from the suite-wide
# resources/sample_jobs/flowx_sample_seed_job.yml (tasks seed_sample_06_iteration1..3), which
# must have completed at least once:
#
#   databricks bundle run flowx_sample_seed_job         -t dev_flowx -p dev_flowx
#   databricks bundle run flowx_sample_06_asn1_tap3_job -t dev_flowx -p dev_flowx
#
# PDU CHOICE -- why `Notification` and not `DataInterChange`. TAP.310's top-level
# `DataInterChange` is an ASN.1 CHOICE, and its `TransferBatch` arm reaches `CallEventDetail`,
# also a CHOICE. `asn1/decoder.py::derive_asn1_field_defs` requires the PDU to be a top-level
# SEQUENCE and rejects CHOICE outright ("ASN.1 CHOICE types are not yet supported by schema
# auto-derivation"), so neither can be the PDU. `Notification` is `[APPLICATION 2] SEQUENCE`,
# its entire member tree resolves, and it is a real TAP3 file-level PDU -- the notification file
# a roaming partner sends when it has no chargeable events to transfer. It also exercises three
# Spark output shapes in one PDU: scalars, a nested SEQUENCE -> struct (the three DateTimeLong
# timestamps), and a SEQUENCE OF -> array (operatorSpecInformation).
#
# EXPECTED RESULT after the seed job and this job have both run: 18 rows in
# flowx.flowx_sample.sample_tap3_notification_raw (fileSequenceNumber 00001..00018) and 6
# rows in sample_tap3_notification_raw_quarantine -- the 2 deliberately truncated payloads per
# iteration, each carrying a populated `_asn1_decode_error` and a NULL fileSequenceNumber
# (nothing decoded, so the quarantine table's record_id_column has nothing to carry).
#
# asn1tools is a declared dependency of the framework wheel (pyproject.toml), so the
# `../../dist/*.whl` entries below install it into both this job's tasks and the pipeline; there
# is no separate library to list, and no manual prerequisite of any kind for this sample.
#
# Onboarding is DELEGATED to the generic onboarding_job
# (resources/flowx_config_jobs/onboarding_job.yml) via run_job_task -- never an inline
# 02_onboarding_engine.py notebook_task. Self-contained and idempotent (control-table upsert +
# CREATE ... IF NOT EXISTS provisioning), so this job can be re-run on its own at any time. See
# resources/sample_jobs/onboarding/sample_06_asn1_tap3_ingestion.json.

# ---------------------------------------------------------------------------------------------
# DEVELOPER BLUEPRINT -- the 2-task sample template. Clone this file.
#
#   pipeline_task       runs the Lakeflow pipeline (the transformation logic)
#   observability_task  exports telemetry, DQ results and execution metrics for that update
#
# THAT IS THE WHOLE JOB. Provisioning is deliberately NOT here. Control-table setup, spec
# onboarding and fixture seeding all live in the ONE suite-wide provisioning job,
# resources/sample_jobs/flowx_sample_seed_job.yml, which must have run at least once:
#
#   databricks bundle run flowx_sample_seed_job -t <target> -p <profile>   # once
#   databricks bundle run flowx_sample_06_asn1_tap3_job -t <target> -p <profile>
#
# WHY ONBOARDING MOVED OUT. `pipeline_task` reads its configuration from the control tables;
# a group that was never onboarded fails in repository.py with
# `FrameworkConfigError: No active dataflow_group_spec row found for dataflow_group_id=...`.
# Onboarding is provisioning -- the same category as seeding -- so it is done once by the seed
# job for all six samples, not re-done on every developer run.
#
# The onboarding spec for this sample lives in the bundle at
# resources/sample_jobs/onboarding/sample_06_asn1_tap3_ingestion.json
# ---------------------------------------------------------------------------------------------

resources:
  jobs:
    flowx_sample_06_asn1_tap3_job:
      name: FlowX Sample 06 - Real GSMA TAP3 ASN.1 BER Ingestion (TAP.310 Notification)

      tasks:
        # 1/2 -- core pipeline / transformation logic.
        - task_key: pipeline_task
          pipeline_task:
            pipeline_id: ${resources.pipelines.flowx_sample_06_asn1_tap3_pipeline.id}

        # 2/2 -- telemetry, data-quality validation and execution monitoring for the update
        # `pipeline_task` just completed. All four base_parameters below are REQUIRED -- see
        # resources/observability/dlt_observability_job.yml's PARAMETER CONTRACT note.
        - task_key: observability_task
          depends_on:
            - task_key: pipeline_task
          notebook_task:
            notebook_path: ../../notebooks/08_observability/08_dlt_observability_engine.py
            base_parameters:
              dataflow_group_id: dfg_sample_06_asn1_tap3
              catalog: flowx
              env: dev
              pipeline_task_run_id: "{{tasks.pipeline_task.run_id}}"
              service_name: dlt-observability-flowx-sample-06
              fail_task_on_dispatch_error: "true"
          environment_key: framework_env

      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../../dist/*.whl
