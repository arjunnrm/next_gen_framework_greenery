# Sample 04 -- "Encrypted ZIP CSV Export Egress" (reference, not a test): the Lakeflow
# Declarative Pipeline hosting dfg_sample_04_export_encrypt_zip's two APPEND ingestion flows
# and two 'sink' transformation flows (dlt.create_sink format 'pgp_zip', staged_file_format
# 'csv', post_export_archive.secret AES-256 passkey ZIPs -- no PGP layer). Requires the UC
# secret flowx.flowx_sample.sample_zip_passkey at update time -- see the job header
# (resources/sample_jobs/flowx_sample_04_export_encrypt_zip_job.yml). Tables publish into
# the single flowx.flowx_sample schema; archives land under
# /Volumes/flowx/flowx_sample/exports/. See
# resources/sample_jobs/onboarding/sample_04_export_encrypt_zip.json.

resources:
  pipelines:
    flowx_sample_04_export_encrypt_zip_pipeline:
      name: flowx_sample_04_export_encrypt_zip_pipeline_${bundle.target}
      catalog: flowx
      schema: flowx_sample
      serverless: true
      photon: true
      development: true
      continuous: false

      libraries:
        - notebook:
            path: ../../notebooks/03_engine/03_lakeflow_declarative_pipeline.py

      environment:
        dependencies:
          - ../../dist/*.whl

      configuration:
        dataflow.group.id: dfg_sample_04_export_encrypt_zip
        dataflow.control.catalog: flowx
