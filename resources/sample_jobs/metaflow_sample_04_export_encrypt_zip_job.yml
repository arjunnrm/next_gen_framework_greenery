# Sample 04 -- Password-Protected ZIP CSV Export Egress (reference, not a test): two APPEND
# ingestion flows land order/customer slices and TWO transformation flows join them
# (stream-static) into TWO genuine Lakeflow sinks (target_type 'sink', sink_config format
# 'pgp_zip' with staged_file_format 'csv' -- NEW in v1.6.0), each micro-batch packed by
# post_export_archive into an AES-256 password-protected ZIP under
# /Volumes/metaflow/metaflow_sample/exports/ -- protected via post_export_archive.secret (the
# ZIP's own password), deliberately INSTEAD of pgp_encryption. Everything isolated in the
# metaflow.metaflow_sample schema.
#
#
# SEED FIRST. This job lands no data of its own. Its fixtures come from the suite-wide
# resources/sample_jobs/metaflow_sample_seed_job.yml (tasks seed_sample_04_iteration1..3), which
# must have completed at least once:
#
#   databricks bundle run metaflow_sample_seed_job                 -t dev_metaflow -p dev_metaflow
#   databricks bundle run metaflow_sample_04_export_encrypt_zip_job -t dev_metaflow -p dev_metaflow
#
# All three seeded slices are on disk before this job runs, so the single pipeline update below
# exports them together rather than as three separate archives per sink.
#
# MANUAL PREREQUISITE (one-time, admin-audited, external to this bundle -- mirroring
# resources/bt_tests/metaflow_test_ing_005_pgp_decrypt_job.yml's documented-prerequisite
# pattern): the Unity Catalog secret metaflow.metaflow_sample.sample_zip_passkey must already
# exist before run_pipeline can export (any string works -- pyzipper derives its AES key from
# the passphrase via its own KDF; resolved at runtime via
# dbutils.secrets.get(catalog=, schema=, key=), the UC three-level model). The seed job's Sample
# 04 chain preflights this secret and fails fast with a clear message if it is unresolvable, so
# the failure happens during seeding, not mid-pipeline-update. The SAME secret also protects
# (and decrypts) Sample 05's inbound archives -- provision it once, both samples work. See
# metaflow_testing/README.md's "Sample reference suite" section for the provisioning command.
#
# Onboarding is DELEGATED to the generic onboarding_job
# (resources/metaflow_config_jobs/onboarding_job.yml) via run_job_task -- never an inline
# 02_onboarding_engine.py notebook_task. Self-contained and idempotent, so this job can be
# re-run on its own at any time. See resources/sample_jobs/onboarding/sample_04_export_encrypt_zip.json.

# ---------------------------------------------------------------------------------------------
# DEVELOPER BLUEPRINT -- the 2-task sample template. Clone this file.
#
#   pipeline_task       runs the Lakeflow pipeline (the transformation logic)
#   observability_task  exports telemetry, DQ results and execution metrics for that update
#
# THAT IS THE WHOLE JOB. Provisioning is deliberately NOT here. Control-table setup, spec
# onboarding and fixture seeding all live in the ONE suite-wide provisioning job,
# resources/sample_jobs/metaflow_sample_seed_job.yml, which must have run at least once:
#
#   databricks bundle run metaflow_sample_seed_job -t <target> -p <profile>   # once
#   databricks bundle run metaflow_sample_04_export_encrypt_zip_job -t <target> -p <profile>
#
# WHY ONBOARDING MOVED OUT. `pipeline_task` reads its configuration from the control tables;
# a group that was never onboarded fails in repository.py with
# `FrameworkConfigError: No active dataflow_group_spec row found for dataflow_group_id=...`.
# Onboarding is provisioning -- the same category as seeding -- so it is done once by the seed
# job for all six samples, not re-done on every developer run.
#
# The onboarding spec for this sample lives in the bundle at
# resources/sample_jobs/onboarding/sample_04_export_encrypt_zip.json
# ---------------------------------------------------------------------------------------------

resources:
  jobs:
    metaflow_sample_04_export_encrypt_zip_job:
      name: Metaflow Sample 04 - Encrypted ZIP CSV Export Egress (AES-256 Passkey)

      tasks:
        # 1/2 -- core pipeline / transformation logic.
        - task_key: pipeline_task
          pipeline_task:
            pipeline_id: ${resources.pipelines.metaflow_sample_04_export_encrypt_zip_pipeline.id}

        # 2/2 -- telemetry, data-quality validation and execution monitoring for the update
        # `pipeline_task` just completed. All four base_parameters below are REQUIRED -- see
        # resources/observability/dlt_observability_job.yml's PARAMETER CONTRACT note.
        - task_key: observability_task
          depends_on:
            - task_key: pipeline_task
          notebook_task:
            notebook_path: ../../notebooks/08_observability/08_dlt_observability_engine.py
            base_parameters:
              dataflow_group_id: dfg_sample_04_export_encrypt_zip
              catalog: metaflow
              env: dev
              pipeline_task_run_id: "{{tasks.pipeline_task.run_id}}"
              service_name: dlt-observability-metaflow-sample-04
              fail_task_on_dispatch_error: "true"
          environment_key: framework_env

      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../../dist/*.whl
