# Runs the UC_7 CDR ASN.1 group:
#
#   run_pipeline_update -> observability_export
#
# PROVISIONING AND ONBOARDING ARE NOT PART OF THIS JOB (trimmed 2026-09-08 at the project
# owner's request: this job carries the pipeline update and the observability export, nothing
# else). The pipeline reads control-table rows, so those rows must already exist -- run
# onboarding separately before the first run of this job and again after any spec edit:
#
#   databricks bundle run onboarding_job -t <target> -p <profile> --params #     spec_file_path=<workspace file_path>/BT_Usecase/UC7/onboarding/UC7_cdr_asn_bronze.json,#     catalog=<catalog>,env=<target>,action_type=UPDATE
#
# (prefix with MSYS_NO_PATHCONV=1 in Git Bash, or the leading /Workspace path is mangled).
# Onboarding still goes through the generic resources/flowx_config_jobs/onboarding_job.yml --
# the single parameterised entrypoint. Never inline 02_onboarding_engine.py here.
#
# Control-table provisioning (the additive migration that `bundle deploy` does not apply) is
# likewise external now; the onboarding engine's own ensure_control_schema_exists covers the
# CREATE ... IF NOT EXISTS path, but 01_setup_control_tables.py is what installs the
# preflight_check_onboarding_spec UC function and the <catalog>.observability semantic layer.
#
# PARAMETER CONTRACT for observability_export: pipeline_task_run_id must be a TASK
# base_parameter, never a pipeline configuration: key. `{{tasks.<key>.run_id}}` is a Jobs
# dynamic value resolved per job run, and a mistyped task_key is passed through as literal text
# rather than failing at the platform layer -- runtime_params.py detects exactly that and names
# it. The task also cross-checks dataflow_group_id against the pipeline it observed and fails if
# they disagree, which catches a copy-paste left pointing at the job it came from.
resources:
  jobs:
    uc7_cdr_asn_job:
      name: 001_lfj_uc7_cdr_asn

      # Job tags are the ONLY way a Lakeflow job run can be attributed back to its Metaflow
      # dataflow group in the system tables. The framework passes dataflow_group_id as a
      # notebook task base_parameter, and those do NOT surface in
      # system.lakeflow.job_task_run_timeline.task_parameters (verified empty on a live
      # workspace) -- so without this tag, flowx.observability.v_job_runs falls back to matching
      # the group id against the job name, and system.billing.usage cannot attribute job cost to
      # the group at all. Keep the tag value identical to the dataflow_group_id in the spec.
      tags:
        dataflow_group_id: dfg_uc7_cdr_asn
        framework: flowx

      tasks:
        - task_key: run_pipeline_update
          pipeline_task:
            pipeline_id: ${resources.pipelines.uc7_cdr_asn_pipeline.id}

        - task_key: observability_export
          depends_on:
            - task_key: run_pipeline_update
          notebook_task:
            notebook_path: ../../notebooks/08_observability/08_dlt_observability_engine.py
            base_parameters:
              dataflow_group_id: dfg_uc7_cdr_asn
              catalog: ${var.catalog}
              env: ${bundle.target}
              pipeline_task_run_id: "{{tasks.run_pipeline_update.run_id}}"
              service_name: dlt-observability-uc7-cdr-asn
              fail_task_on_dispatch_error: "true"
          environment_key: framework_env

      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../../dist/*.whl
