# UC6 -- Flood Warning System (Environment Agency -> Leidos). Runs the group:
#
#   run_pipeline_update -> observability_export
#
# THIS JOB IS ORCHESTRATION ONLY. It performs no file I/O, no decryption, no archiving and no
# business logic -- all of that is the pipeline's, and the use case's design calls that split
# out explicitly so scheduling/alerting changes and data-engineering changes can be deployed
# independently. The framework enforces the same split structurally: ingestion, DQ, crypto and
# sinks are Lakeflow graph-definition concerns and cannot run from a job task.
#
# PROVISIONING, ONBOARDING AND GOVERNANCE ARE NOT PART OF THIS JOB (trimmed 2026-09-08 at the
# project owner's request: this job carries the pipeline update and the observability export,
# nothing else). Three consequences, each needing a separate action:
#
#   1. The pipeline reads control-table rows, not the spec file, so onboarding must run
#      BEFORE the first run of this job and again after any spec edit:
#        databricks bundle run onboarding_job -t <target> -p <profile> --params #          spec_file_path=<workspace file_path>/BT_Usecase/UC6/onboarding/uc6_ea_flood_warning.json,#          catalog=<catalog>,env=<target>,action_type=UPDATE,prune_missing_flows=true
#      (prefix MSYS_NO_PATHCONV=1 in Git Bash, or the leading /Workspace path is mangled.)
#      Keep prune_missing_flows=true: this spec is the only owner of dfg_uc6_ea_flood_warning,
#      so rows for flows it no longer declares are stale by definition.
#
#   2. Control-table provisioning (the additive migration `bundle deploy` does not apply, plus
#      the preflight_check_onboarding_spec UC function and the <catalog>.observability semantic
#      layer) now comes from running notebooks/01_setup/01_setup_control_tables.py separately.
#
#   3. GOVERNANCE TAGS ARE NO LONGER APPLIED BY THIS JOB. UC tag DDL
#      (ALTER TABLE ... SET TAGS) runs against an already-materialized table and is illegal
#      inside a pipeline's graph-definition code, so it cannot move into the pipeline either --
#      it must be run as its own step. Phase C of the UC3 build proved the cost of omitting it:
#      a pipeline succeeded end to end with ZERO tags in information_schema because no task
#      ever invoked it. Run notebooks/04_governance/04_apply_governance_and_egress.py for
#      dfg_uc6_ea_flood_warning after this job, or the group's governance_tags are inert.
#
# SCHEDULE: none is declared. The legacy cadence is weekly, but the POC is run on demand and an
# Add a `schedule:` block when the upstream EA delivery is actually wired up.
#
# MANUAL PREREQUISITES (both fail loudly, neither degrades silently):
#   1. The UC secret ${var.catalog}.config.pgpkey must exist. It decrypts the inbound EA
#      request AND encrypts two of the four outputs, so a missing secret fails the update
#      rather than emitting plaintext.
#   2. The uc_6 volume and its raw/ + output/ folders must exist:
#        CREATE VOLUME IF NOT EXISTS ${var.catalog}.staging.uc_6;
#      then upload the six source files into /Volumes/<catalog>/staging/uc_6/raw/.
#
# NAME: 007_lfj_uc6_ea_flood_warning, driving pipeline 008_ldp_uc6_ea_flood_warning -- 007/008,
# the next free pair (001 = UC7, 003-006 = UC3). The supplied brief asked for
# "007_uc6_lfj_EA"/"008_uc6_ldp_EA"; every existing asset in this repo puts the number first
# and the type second, lowercase, so the repo convention wins per the brief's own instruction.
# See BT_Usecase/UC6/docs/FRAMEWORK_CAPABILITY_MAP.md section 2.1.

resources:
  jobs:
    uc6_ea_flood_warning_job:
      name: 007_lfj_uc6_ea_flood_warning

      # Job tags are the ONLY way a Lakeflow job run can be attributed back to its Metaflow
      # dataflow group in the system tables. The framework passes dataflow_group_id as a
      # notebook task base_parameter, and those do NOT surface in
      # system.lakeflow.job_task_run_timeline.task_parameters (verified empty on a live
      # workspace) -- so without this tag, flowx.observability.v_job_runs falls back to matching
      # the group id against the job name, and system.billing.usage cannot attribute job cost to
      # the group at all. Keep the tag value identical to the dataflow_group_id in the spec.
      tags:
        dataflow_group_id: dfg_uc6_ea_flood_warning
        framework: flowx

      tasks:
        - task_key: run_pipeline_update
          pipeline_task:
            pipeline_id: ${resources.pipelines.uc6_ea_flood_warning_pipeline.id}

        - task_key: observability_export
          depends_on:
            - task_key: run_pipeline_update
          notebook_task:
            notebook_path: ../../notebooks/08_observability/08_dlt_observability_engine.py
            base_parameters:
              dataflow_group_id: dfg_uc6_ea_flood_warning
              catalog: ${var.catalog}
              env: ${bundle.target}
              pipeline_task_run_id: "{{tasks.run_pipeline_update.run_id}}"
              service_name: dlt-observability-uc6-ea-flood-warning
              fail_task_on_dispatch_error: "true"
          environment_key: framework_env

      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../../dist/*.whl
