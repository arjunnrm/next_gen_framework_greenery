# TC-SEC-003: "Secret Masking & Redaction in Telemetry" -- proves (or, as currently built,
# deliberately fails to prove -- see docs/56_tc_sec_003.md) that an encryption key resolved via
# dbutils.secrets.get() never leaks in plaintext through driver logs or Spark query plans. One
# ingestion flow, target_type: external_sink, both AES-GCM-encrypts secret_value into
# {{catalog}}.bronze_sec.secrets_audit_raw (target_config.encrypted_columns, keyed off the SAME
# {{catalog}}.security.pii_encryption_key UC secret TC-SEC-001/TC-TRF-003 already reuse) AND, in
# the SAME pipeline update, PGP-exports that already-ciphertext row set as a .zip.pgp archive
# (target_config.sink_config, format pgp_zip, keyed off the SAME
# {{catalog}}.security.pgp_public_key_finance_egress_test UC secret TC-SNK-003 already
# provisions). See metaflow_testing/035_sec_003_redaction.json and docs/56_tc_sec_003.md.

resources:
  pipelines:
    metaflow_test_sec_003_redaction_pipeline:
      name: metaflow_test_sec_003_redaction_pipeline_${bundle.target}
      catalog: metaflow
      schema: bronze_sec
      serverless: true
      photon: true
      development: true
      continuous: false

      libraries:
        - notebook:
            path: ../notebooks/03_engine/03_lakeflow_declarative_pipeline.py

      environment:
        dependencies:
          - ../dist/*.whl

      configuration:
        dataflow.group.id: dfg_sec_003_redaction
        dataflow.control.catalog: metaflow
