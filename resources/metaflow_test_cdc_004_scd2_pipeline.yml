# TC-CDC-004: "SCD Type 2 Full History & Active Companion View (SCD2)" -- proves cdc_load_strategy
# "SCD2" opens a new history row (__START_AT/__END_AT) when a tracked column changes (employee
# E101's dept_id: D1 -> D2) instead of overwriting the existing row, that an untracked column
# bump alone does not open a spurious version (columns_to_check scopes tracking to dept_id
# only), and that the framework's auto-generated dim_employee_scd2_current companion view
# (cdc/scd.py::register_scd2_reporting_view) reports only the active D2 row. See
# metaflow_testing/022_cdc_004_scd2.json and docs/43_tc_cdc_004.md.

resources:
  pipelines:
    metaflow_test_cdc_004_scd2_pipeline:
      name: metaflow_test_cdc_004_scd2_pipeline_${bundle.target}
      catalog: metaflow
      schema: silver_hr
      serverless: true
      photon: true
      development: true
      continuous: false

      libraries:
        - notebook:
            path: ../notebooks/03_engine/03_lakeflow_declarative_pipeline.py

      environment:
        dependencies:
          - ../dist/*.whl

      configuration:
        dataflow.group.id: dfg_cdc_004_scd2
        dataflow.control.catalog: metaflow
