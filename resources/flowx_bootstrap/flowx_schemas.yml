# The schemas this bundle's own resources live in.
#
# Scope: ONLY the schemas that a bundle resource points at directly. The dozens of
# `bronze_*` / `silver_*` schemas named by the feature-test and BT-fixture pipelines are NOT
# here -- a Lakeflow pipeline creates its own target schema on its first update, and declaring
# ~40 of them would burn the schema quota that the `dev` target has already nearly exhausted
# (its catalog sits at 51 schemas; see databricks.yml's LIVE CAVEAT). What is declared here is
# the set whose absence FAILS A DEPLOY rather than a pipeline run:
#
#   config           holds framework_wheels_volume (= every target's workspace.artifact_path)
#                    and onboarding_specs_volume, plus the framework's control tables.
#                    Its absence is the exact error this file was added for:
#                    "cannot create resources.volumes.framework_wheels_volume:
#                     Schema 'flowx.config' does not exist".
#   flowx_sample  the sample suite's isolated schema, plus its three Volumes below.
#
# THERE IS NO SEPARATE "WORKING" SCHEMA, AND ${var.schema} NO LONGER EXISTS (removed 2026-09-14).
# A `working_schema` resource used to declare ${var.schema} here. It was removed because nothing
# consumed the variable: the pipelines hard-code their own target schemas (`bronze`,
# `observability`), and the two jobs taking a `schema` parameter default to `staging` and
# ${var.spec_schema} respectively. Its only effect was to create an empty schema per target --
# and it made a target that set `schema: config` UNDEPLOYABLE, because `config_schema` below
# already declares that name and DABs identifies a schema by its full name:
#
#   Error: cannot create resources.schemas.working_schema:
#          Schema 'config' already exists (400 SCHEMA_ALREADY_EXISTS)
#
# which then took `volumes.framework_docs_volume` down with it via the dependency edge. That hit
# the `bt_digital_poc` target on 2026-09-13 and `hoonartek` carried the same latent collision.
# Framework data lives in `config` (control tables) and the per-pipeline schemas; if a target
# ever needs another schema, declare it here explicitly rather than reintroducing the variable.
#
# `config_schema` uses the LITERAL `config`, not ${var.spec_schema}, for the same reason
# framework_wheels_volume.yml does: databricks.yml's artifact_path spells `config` literally, so
# a ${var.spec_schema} override must not be able to move this schema out from under it. When a
# target DOES override spec_schema to something other than `config`, add that schema here too --
# onboarding_specs_volume follows the variable and will otherwise land in a schema nothing
# creates.
#
# prevent_destroy on all three: these schemas hold the control tables, the published wheels and
# the sample datasets. DABs deletes any resource missing from the config (see databricks.yml's
# RESOURCE LAYOUT header), so the guard is what stops an editing mistake becoming data loss.
#
# THE CATALOG IS NOT DECLARED, AND MUST NOT BE. ${var.catalog} is a documented PREREQUISITE --
# created once per workspace in the UI. A catalogs.* resource was tried on 2026-09-02 and removed
# the same day: these accounts use UC Default Storage, so CREATE CATALOG without a MANAGED
# LOCATION is rejected (400 INVALID_STATE), and a Default-Storage catalog's storage_root is an
# account-managed bucket path with generated UUIDs that cannot be written into YAML. Worse, the
# failing catalog resource propagated down the dependency edge and took these schemas with it
# ("cannot create resources.schemas.config_schema: dependency failed"). Full write-up, including
# the verbatim errors, in this folder's README.md. A unit test keeps it undeclared.
#
# ALREADY-EXISTING SCHEMAS: bind rather than re-create. `flowx.config` predates this group on
# dev_flowx and hoonartek, so DABs does not own it there and a create attempt fails with
# "Schema 'config' already exists":
#
#   databricks bundle deployment bind schemas.config_schema flowx.config -t dev_flowx -p dev_flowx
#
# Not needed on arjun_2 -- config_schema was created by this bundle on 2026-09-02.
resources:
  schemas:
    config_schema:
      catalog_name: ${var.catalog}
      name: config
      comment: >-
        Framework configuration schema -- control tables, the onboarding-spec Volume the
        Onboarding App writes to, and the wheels Volume that `bundle deploy` publishes into.
      lifecycle:
        prevent_destroy: true

    sample_suite_schema:
      catalog_name: ${var.catalog}
      name: flowx_sample
      comment: >-
        Isolated schema for the six flowx_sample reference jobs -- their Bronze/Silver
        tables plus the landing, exports and observability Volumes.
      lifecycle:
        prevent_destroy: true
