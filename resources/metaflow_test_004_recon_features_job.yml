# Metaflow test scenario 004: "Reconciliation feature test" -- exercises reconciliation
# functionality added on top of the existing engine: conditional reconciliation_run_log/
# reconciliation_mismatch_log capture (logging_config.run_log_capture/mismatch_log_capture),
# the always-populated reconciliation_result table, task_run_id threading from a parent job,
# and the streaming reconciliation path (a read_mode: "streaming" side, drained by
# trigger(availableNow=True) -- see reconciliation/streaming.py,
# notebooks/05_reconciliation/05_reconciliation_engine.py). NOTE v1.4.0: recon_mode is removed;
# reconciliation is triggered-only, so the task below is now a bounded drain-and-stop run. Reuses scenario 002/003's own
# already-onboarded bronze tables (autoload_bronze/zerobus_bronze) as the comparison pair --
# reconciliation is not a Lakeflow Declarative Pipeline flow type (see
# metaflow_test_003_autoload_recon_pipeline.yml's own header comment), so this scenario needs
# no dedicated pipeline resource of its own, only the onboarding + reconciliation-engine tasks;
# self-contained (re-runs the 002/003 setup/seed/onboard/pipeline chain itself rather than
# assuming those scenarios already ran) rather than reusing comparison_direction: "both" (which
# would re-append the same missing records scenario 003's own recon flow already appends) --
# every reconciliation_id here uses comparison_direction: "target_to_source" (audit-only, never
# mutates anything) since the point of this scenario is exercising logging/parameterization
# mechanics, not re-testing the self-healing append behavior scenario 003 already covers.

resources:
  jobs:
    metaflow_test_004_recon_features_job:
      name: Metaflow Test 004 - Reconciliation Feature Test (Logging, task_run_id, Continuous Mode)

      tasks:
        - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../notebooks/01_setup/01_setup_control_tables.py
            base_parameters:
              catalog: metaflow
          environment_key: framework_env

        - task_key: seed_metaflow_testing_data
          depends_on:
            - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../notebooks/00_seed_sample_data/02_seed_metaflow_testing_data.py
            base_parameters:
              catalog: metaflow
          environment_key: framework_env

        - task_key: onboard_002
          depends_on:
            - task_key: seed_metaflow_testing_data
          notebook_task:
            notebook_path: ../notebooks/02_onboarding/02_onboarding_engine.py
            base_parameters:
              spec_file_path: "${workspace.file_path}/metaflow_testing/002_zerobus_data_load.json"
              catalog: metaflow
              env: dev
              action_type: CREATE
          environment_key: framework_env

        - task_key: run_002_pipeline
          depends_on:
            - task_key: onboard_002
          pipeline_task:
            pipeline_id: ${resources.pipelines.metaflow_test_002_zerobus_pipeline.id}

        - task_key: onboard_003
          depends_on:
            - task_key: run_002_pipeline
          notebook_task:
            notebook_path: ../notebooks/02_onboarding/02_onboarding_engine.py
            base_parameters:
              spec_file_path: "${workspace.file_path}/metaflow_testing/003_autoload_recon_append.json"
              catalog: metaflow
              env: dev
              action_type: CREATE
          environment_key: framework_env

        - task_key: run_003_pipeline
          depends_on:
            - task_key: onboard_003
          pipeline_task:
            pipeline_id: ${resources.pipelines.metaflow_test_003_autoload_recon_pipeline.id}

        - task_key: onboard_004
          depends_on:
            - task_key: run_003_pipeline
          notebook_task:
            notebook_path: ../notebooks/02_onboarding/02_onboarding_engine.py
            base_parameters:
              spec_file_path: "${workspace.file_path}/metaflow_testing/004_recon_features_test.json"
              catalog: metaflow
              env: dev
              action_type: CREATE
          environment_key: framework_env

        # Both logging flags true -- reconciliation_run_log AND reconciliation_mismatch_log get
        # rows, plus the always-on reconciliation_result. All three carry the same task_run_id.
        - task_key: run_004_recon_logging_on
          depends_on:
            - task_key: onboard_004
          notebook_task:
            notebook_path: ../notebooks/05_reconciliation/05_reconciliation_engine.py
            base_parameters:
              catalog: metaflow
              reconciliation_id: recon_004_logging_on
              task_run_id: "{{job.run_id}}"
          environment_key: framework_env

        # Both logging flags false -- only reconciliation_result gets a row; verifies
        # reconciliation_run_log/reconciliation_mismatch_log genuinely receive nothing new for
        # this reconciliation_id this run.
        - task_key: run_004_recon_logging_off
          depends_on:
            - task_key: onboard_004
          notebook_task:
            notebook_path: ../notebooks/05_reconciliation/05_reconciliation_engine.py
            base_parameters:
              catalog: metaflow
              reconciliation_id: recon_004_logging_off
              task_run_id: "{{job.run_id}}"
          environment_key: framework_env

        # Streaming reconciliation: the target side reads read_mode: "streaming", so this
        # exercises reconciliation/streaming.py's foreachBatch path under
        # trigger(availableNow=True) -- it drains everything currently available across as many
        # internal micro-batches as needed, then STOPS. Before v1.4.0 this task carried
        # recon_mode: continuous and ran forever; that mode is removed (it also never worked on
        # serverless job compute -- INFINITE_STREAMING_TRIGGER_NOT_SUPPORTED). The task now
        # completes on its own, which is what makes it runnable in an ordinary test wave.
        - task_key: run_004_recon_streaming
          depends_on:
            - task_key: onboard_004
          notebook_task:
            notebook_path: ../notebooks/05_reconciliation/05_reconciliation_engine.py
            base_parameters:
              catalog: metaflow
              reconciliation_id: recon_004_streaming
              task_run_id: "{{job.run_id}}"
              checkpoint_root: "/Volumes/metaflow/Excalibur_usecase/_checkpoints/recon_004_streaming/"
          environment_key: framework_env

      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl
