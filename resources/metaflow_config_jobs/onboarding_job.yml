# Reusable onboarding job: a single job definition that can onboard (CREATE/UPDATE/
# VALIDATE_ONLY) ANY onboarding spec JSON, driven entirely by job parameters supplied at
# `databricks bundle run` time -- not deploy-time bundle variables, and not a hardcoded spec
# path baked into a task's `base_parameters` (contrast with resources/metadata_framework_job.yml,
# whose 6 `onboard_spec_NN` tasks are each pinned to one specific test_specs/*.json file; that
# job -- and the other 5 legacy per-suite job/pipeline resource files -- is left completely
# untouched by this v2 redesign, wiring and all, per the project's "keep legacy jobs as-is,
# add new orchestration alongside" decision).
#
# Usage:
#   databricks bundle run onboarding_job --target dev \
#     --params spec_file_path=/Workspace/.../test_specs/spec_09_....json,catalog=poc,env=dev,action_type=CREATE
#
# `spec_file_path` defaults to an empty string -- the Databricks Jobs schema requires every
# declared job parameter to have a default, but the onboarding notebook itself immediately
# raises a clear ValueError ("The 'spec_file_path' widget is required.") if it's left empty,
# so an invocation that forgets to override it fails fast and obviously rather than silently
# onboarding some hardcoded default spec. `catalog`/`env`/`action_type` default to this
# project's usual dev-loop values but can be overridden the same way. See
# notebooks/02_onboarding/02_onboarding_engine.py for what each parameter drives (identical
# widget names, passed straight through as base_parameters).
#
# This is a plain notebook-task job -- job parameters (`{{job.parameters.*}}`) are a stable,
# GA Databricks Jobs feature (not the pipeline_task.parameters Beta feature, which only
# reaches SQL-source Lakeflow pipelines, not this framework's Python engine notebook; see
# resources/lakeflow_metadata_pipeline.yml's comment for that distinction), so this job
# achieves genuine per-run runtime parameterization with no platform caveats.

resources:
  jobs:
    onboarding_job:
      name: Metaflow Config Onboarding

      parameters:
        - name: spec_file_path
          default: ""
        - name: catalog
          default: ${var.catalog}
        - name: env
          default: ${bundle.target}
        - name: action_type
          default: CREATE

      tasks:
        - task_key: onboard
          notebook_task:
            notebook_path: ../../notebooks/02_onboarding/02_onboarding_engine.py
            base_parameters:
              spec_file_path: "{{job.parameters.spec_file_path}}"
              catalog: "{{job.parameters.catalog}}"
              env: "{{job.parameters.env}}"
              action_type: "{{job.parameters.action_type}}"
          environment_key: framework_env

      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../../dist/*.whl
