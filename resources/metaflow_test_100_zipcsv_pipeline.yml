# Metaflow test scenario 100: "ZIP CSV onboarding" -- a single PGP-then-password-protected
# ZIP (customer*.zip) autoloaded via source_zip_handling + pre_extraction_decryption into
# bronze_test.customer_raw with SCD1, quarantine, and column exclusion.
#
# Targets the `metaflow` catalog (control tables live in metaflow.config, same as every other
# metaflow_testing/*.json spec) -- see metaflow_testing/100_zipcsv_onbaording.json.

resources:
  pipelines:
    metaflow_test_100_zipcsv_pipeline:
      name: metaflow_test_100_zipcsv_pipeline_${bundle.target}
      catalog: metaflow
      schema: bronze_test
      serverless: true
      photon: true
      development: true
      continuous: false

      libraries:
        - notebook:
            path: ../notebooks/03_engine/03_lakeflow_declarative_pipeline.py

      environment:
        dependencies:
          - ../dist/*.whl

      configuration:
        dataflow.group.id: dfg_zip_csv_dataload
        dataflow.control.catalog: metaflow
