# Wraps metaflow_test_obs_001_json_log_pipeline:
#
#   setup_control_tables -> seed_obs_001_json_log_data -> onboard_obs_001 -> run_pipeline
#     -> capture_cdc_change_counts_obs_001
#
# The final task runs notebooks/04_governance/04_apply_governance_and_egress.py with
# capture_cdc_change_counts: "true" (and apply_abac: "false" -- this spec's own governance_tags
# is empty, there is nothing to tag) purely to exercise the fourth structured-log-emitting code
# path this test case cares about: control_plane/post_deployment.py::capture_all_scd_change_counts
# emits one more log_flow_event(operation="cdc_change_capture", ...) line for this flow's SCD1
# target, which only runs post-deployment (a CDC target's post-update Delta commit version isn't
# knowable from inside the pipeline's own graph-definition code -- see
# docs/02_cdc_load_strategies.md's "Change-count capture via Change Data Feed" section). Every
# other real per-TC job in this repo omits this task since most don't exercise CDC dispatch at
# all; this one adds it deliberately, since TC-OBS-001 is specifically about proving every
# framework operation's structured log line parses as JSON, not just the ones a bare
# setup -> seed -> onboard -> run_pipeline chain reaches on its own.
#
# Self-contained and idempotent (control-table upsert + CREATE ... IF NOT EXISTS schema/volume
# provisioning + fresh-copy CSV seed), so this job can be re-run on its own at any time.

resources:
  jobs:
    metaflow_test_obs_001_json_log_job:
      name: Metaflow Test OBS-001 - In-Pipeline Structured JSON Logging

      tasks:
        - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../notebooks/01_setup/01_setup_control_tables.py
            base_parameters:
              catalog: metaflow
          environment_key: framework_env

        - task_key: seed_obs_001_json_log_data
          depends_on:
            - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../notebooks/00_seed_sample_data/03_seed_obs_001_json_log_data.py
            base_parameters:
              catalog: metaflow
          environment_key: framework_env

        - task_key: onboard_obs_001
          depends_on:
            - task_key: seed_obs_001_json_log_data
          notebook_task:
            notebook_path: ../notebooks/02_onboarding/02_onboarding_engine.py
            base_parameters:
              spec_file_path: "${workspace.file_path}/metaflow_testing/042_obs_001_json_log.json"
              catalog: metaflow
              env: dev
              action_type: CREATE
          environment_key: framework_env

        - task_key: run_pipeline
          depends_on:
            - task_key: onboard_obs_001
          pipeline_task:
            pipeline_id: ${resources.pipelines.metaflow_test_obs_001_json_log_pipeline.id}

        - task_key: capture_cdc_change_counts_obs_001
          depends_on:
            - task_key: run_pipeline
          notebook_task:
            notebook_path: ../notebooks/04_governance/04_apply_governance_and_egress.py
            base_parameters:
              catalog: metaflow
              dataflow_group_id: dfg_obs_001_json_log
              apply_abac: "false"
              capture_cdc_change_counts: "true"
          environment_key: framework_env

      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl
