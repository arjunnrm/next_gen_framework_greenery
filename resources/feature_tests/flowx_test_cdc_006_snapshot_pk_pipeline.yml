# TC-CDC-006: "Full Snapshot Diffing with Natural PK" -- proves cdc_load_strategy
# "FULL_SNAPSHOT_CDC" diffs successive full inventory extracts by the natural business key
# (item_id) via dlt.apply_changes_from_snapshot(). See
# flowx_testing/024_cdc_006_snapshot_pk.json and docs/45_tc_cdc_006.md.

resources:
  pipelines:
    flowx_test_cdc_006_snapshot_pk_pipeline:
      name: flowx_test_cdc_006_snapshot_pk_pipeline_${bundle.target}
      catalog: flowx
      schema: silver_inventory
      serverless: true
      photon: true
      development: true
      continuous: false

      libraries:
        - notebook:
            path: ../../notebooks/03_engine/03_lakeflow_declarative_pipeline.py

      environment:
        dependencies:
          - ../../dist/*.whl

      configuration:
        dataflow.group.id: dfg_cdc_006_snapshot_pk
        dataflow.control.catalog: flowx
