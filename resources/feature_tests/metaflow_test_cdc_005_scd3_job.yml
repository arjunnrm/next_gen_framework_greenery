# Wraps metaflow_test_cdc_005_scd3_pipeline across 3 separate pipeline updates, one per landed
# subscription status-change batch -- this interleaved land/run/land/run/land/run sequence is
# the whole point of TC-CDC-005 (SCD3's current/previous pivot can only be observed by actually
# advancing subscription S100 through 3 real, separately-processed status changes):
#
#   setup_control_tables -> seed_batch1 (TRIAL) -> onboard_cdc_005 -> run_pipeline_batch1
#     -> seed_batch2 (ACTIVE) -> run_pipeline_batch2
#       -> seed_batch3 (CHURNED) -> run_pipeline_batch3
#
# Onboarding happens once, before the first pipeline update -- the spec itself never changes
# between batches, only the landed data does. Self-contained and idempotent (control-table
# upsert + CREATE ... IF NOT EXISTS schema/volume provisioning + idempotent fixture copy), so
# this job can be re-run on its own at any time. See metaflow_testing/023_cdc_005_scd3.json and
# docs/44_tc_cdc_005.md.

resources:
  jobs:
    metaflow_test_cdc_005_scd3_job:
      name: Metaflow Test CDC-005 - SCD Type 3 Current & Previous State

      tasks:
        - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../../notebooks/01_setup/01_setup_control_tables.py
            base_parameters:
              catalog: metaflow
          environment_key: framework_env

        - task_key: seed_cdc_005_batch1
          depends_on:
            - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../../notebooks/00_seed_sample_data/03_seed_cdc_005_scd3_data.py
            base_parameters:
              catalog: metaflow
              batch_number: "1"
          environment_key: framework_env

        - task_key: onboard_cdc_005
          depends_on:
            - task_key: seed_cdc_005_batch1
          notebook_task:
            notebook_path: ../../notebooks/02_onboarding/02_onboarding_engine.py
            base_parameters:
              spec_file_path: "${workspace.file_path}/metaflow_testing/023_cdc_005_scd3.json"
              catalog: metaflow
              env: dev
              action_type: CREATE
          environment_key: framework_env

        - task_key: run_pipeline_batch1
          depends_on:
            - task_key: onboard_cdc_005
          pipeline_task:
            pipeline_id: ${resources.pipelines.metaflow_test_cdc_005_scd3_pipeline.id}

        - task_key: seed_cdc_005_batch2
          depends_on:
            - task_key: run_pipeline_batch1
          notebook_task:
            notebook_path: ../../notebooks/00_seed_sample_data/03_seed_cdc_005_scd3_data.py
            base_parameters:
              catalog: metaflow
              batch_number: "2"
          environment_key: framework_env

        - task_key: run_pipeline_batch2
          depends_on:
            - task_key: seed_cdc_005_batch2
          pipeline_task:
            pipeline_id: ${resources.pipelines.metaflow_test_cdc_005_scd3_pipeline.id}

        - task_key: seed_cdc_005_batch3
          depends_on:
            - task_key: run_pipeline_batch2
          notebook_task:
            notebook_path: ../../notebooks/00_seed_sample_data/03_seed_cdc_005_scd3_data.py
            base_parameters:
              catalog: metaflow
              batch_number: "3"
          environment_key: framework_env

        - task_key: run_pipeline_batch3
          depends_on:
            - task_key: seed_cdc_005_batch3
          pipeline_task:
            pipeline_id: ${resources.pipelines.metaflow_test_cdc_005_scd3_pipeline.id}

      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../../dist/*.whl
