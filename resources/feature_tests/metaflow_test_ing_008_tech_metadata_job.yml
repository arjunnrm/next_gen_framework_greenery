# Wraps metaflow_test_ing_008_tech_metadata_pipeline:
#
#   setup_control_tables -> seed_ing_008_tech_metadata_data -> onboard_ing_008 -> run_pipeline
#
# Self-contained and idempotent (control-table upsert + CREATE ... IF NOT EXISTS schema/volume
# provisioning + a plain file copy re-run each time), so this job can be re-run on its own at
# any time. See metaflow_testing/017_ing_008_tech_metadata.json and docs/38_tc_ing_008.md.

resources:
  jobs:
    metaflow_test_ing_008_tech_metadata_job:
      name: Metaflow Test TC-ING-008 - Technical Metadata Enrichment & Column Ordering

      tasks:
        - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../../notebooks/01_setup/01_setup_control_tables.py
            base_parameters:
              catalog: metaflow
          environment_key: framework_env

        - task_key: seed_ing_008_tech_metadata_data
          depends_on:
            - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../../notebooks/00_seed_sample_data/03_seed_ing_008_tech_metadata_data.py
            base_parameters:
              catalog: metaflow
          environment_key: framework_env

        - task_key: onboard_ing_008
          depends_on:
            - task_key: seed_ing_008_tech_metadata_data
          notebook_task:
            notebook_path: ../../notebooks/02_onboarding/02_onboarding_engine.py
            base_parameters:
              spec_file_path: "${workspace.file_path}/metaflow_testing/017_ing_008_tech_metadata.json"
              catalog: metaflow
              env: dev
              action_type: CREATE
          environment_key: framework_env

        - task_key: run_pipeline
          depends_on:
            - task_key: onboard_ing_008
          pipeline_task:
            pipeline_id: ${resources.pipelines.metaflow_test_ing_008_tech_metadata_pipeline.id}

      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../../dist/*.whl
