# Wraps metaflow_test_sec_002_hashing_pipeline:
#
#   setup_control_tables -> seed_sec_002_hashing_data -> onboard_sec_002 -> run_pipeline
#
# Self-contained and idempotent (control-table upsert + CREATE ... IF NOT EXISTS schema/volume
# provisioning + idempotent fixture copy), so this job can be re-run on its own at any time. See
# metaflow_testing/034_sec_002_hashing.json and docs/55_tc_sec_002.md.

resources:
  jobs:
    metaflow_test_sec_002_hashing_job:
      name: Metaflow Test SEC-002 - SHA-256 Hash Key & Value Determinism

      tasks:
        - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../../notebooks/01_setup/01_setup_control_tables.py
            base_parameters:
              catalog: metaflow
          environment_key: framework_env

        - task_key: seed_sec_002_hashing_data
          depends_on:
            - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../../notebooks/00_seed_sample_data/03_seed_sec_002_hashing_data.py
            base_parameters:
              catalog: metaflow
          environment_key: framework_env

        - task_key: onboard_sec_002
          depends_on:
            - task_key: seed_sec_002_hashing_data
          notebook_task:
            notebook_path: ../../notebooks/02_onboarding/02_onboarding_engine.py
            base_parameters:
              spec_file_path: "${workspace.file_path}/metaflow_testing/034_sec_002_hashing.json"
              catalog: metaflow
              env: dev
              action_type: CREATE
          environment_key: framework_env

        - task_key: run_pipeline
          depends_on:
            - task_key: onboard_sec_002
          pipeline_task:
            pipeline_id: ${resources.pipelines.metaflow_test_sec_002_hashing_pipeline.id}

      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../../dist/*.whl
