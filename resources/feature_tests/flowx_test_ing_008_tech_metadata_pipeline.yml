# TC-ING-008: "Technical Metadata Enrichment & Column Ordering" -- plain CSV Auto Loader
# ingestion proving the already-existing __framework_* technical-metadata column set (see
# ingestion/technical_metadata.py, dq/quarantine.py::add_quarantine_columns) lands correctly
# and that business columns (dept_id, dept_name, region) precede all of them in the target
# table's schema order (storage/column_ordering.py::reorder_columns_for_delta_stats is a
# no-op here -- no primary_keys/liquid_clustering_columns/hash columns are
# configured, so the natural append order from the read is preserved). See
# flowx_testing/017_ing_008_tech_metadata.json and docs/38_tc_ing_008.md.

resources:
  pipelines:
    flowx_test_ing_008_tech_metadata_pipeline:
      name: flowx_test_ing_008_tech_metadata_pipeline_${bundle.target}
      catalog: flowx
      schema: bronze_ea
      serverless: true
      photon: true
      development: true
      continuous: false

      libraries:
        - notebook:
            path: ../../notebooks/03_engine/03_lakeflow_declarative_pipeline.py

      environment:
        dependencies:
          - ../../dist/*.whl

      configuration:
        dataflow.group.id: dfg_ing_008_tech_metadata
        dataflow.control.catalog: flowx
