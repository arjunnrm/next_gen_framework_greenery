# Wraps flowx_test_rec_002_drift_pipeline:
#
#   setup_control_tables -> seed_rec_002_drift_data -> onboard_rec_002 -> run_pipeline
#     -> run_rec_002_reconciliation
#
# The pipeline lands both customer_baseline (C001 @ status=SUSPENDED) and customer_cdc (C001 @
# status=ACTIVE); the reconciliation task then compares them on customer_id and logs C001 as
# VALUE_DRIFT on status. comparison_direction is "target_to_source" (audit-only) so this
# reconciliation run never appends/mutates either table -- see flowx_testing/037_rec_002_drift.json
# and docs/59_tc_rec_002.md (including a real gap this direction choice surfaces against
# reconciliation/appender.py's actual VALUE_DRIFT-logging dispatch).
#
# Self-contained and idempotent (control-table upsert + CREATE ... IF NOT EXISTS schema/volume
# provisioning + idempotent fixture copy), so this job can be re-run on its own at any time.

resources:
  jobs:
    flowx_test_rec_002_drift_job:
      name: FlowX Test REC-002 - Attribute Value Drift Detection (VALUE_DRIFT)

      tasks:
        - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../../notebooks/01_setup/01_setup_control_tables.py
            base_parameters:
              catalog: flowx
          environment_key: framework_env

        - task_key: seed_rec_002_drift_data
          depends_on:
            - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../../notebooks/00_seed_sample_data/03_seed_rec_002_drift_data.py
            base_parameters:
              catalog: flowx
          environment_key: framework_env

        - task_key: onboard_rec_002
          depends_on:
            - task_key: seed_rec_002_drift_data
          notebook_task:
            notebook_path: ../../notebooks/02_onboarding/02_onboarding_engine.py
            base_parameters:
              spec_file_path: "${workspace.file_path}/flowx_testing/037_rec_002_drift.json"
              catalog: flowx
              env: dev
              action_type: CREATE
          environment_key: framework_env

        - task_key: run_pipeline
          depends_on:
            - task_key: onboard_rec_002
          pipeline_task:
            pipeline_id: ${resources.pipelines.flowx_test_rec_002_drift_pipeline.id}

        - task_key: run_rec_002_reconciliation
          depends_on:
            - task_key: run_pipeline
          notebook_task:
            notebook_path: ../../notebooks/05_reconciliation/05_reconciliation_engine.py
            base_parameters:
              catalog: flowx
              reconciliation_id: recon_rec_002_customer_drift
              task_run_id: "{{job.run_id}}"
          environment_key: framework_env

      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../../dist/*.whl
