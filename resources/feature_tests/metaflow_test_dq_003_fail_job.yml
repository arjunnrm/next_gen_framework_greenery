# Wraps metaflow_test_dq_003_fail_pipeline:
#
#   setup_control_tables -> seed_dq_003_fail_data -> onboard_dq_003 -> run_pipeline
#
# Self-contained and idempotent (control-table upsert + CREATE ... IF NOT EXISTS schema/volume
# provisioning + fixture re-copy), so this job can be re-run on its own at any time.
#
# IMPORTANT: `run_pipeline` is EXPECTED TO FAIL every run -- the landed fixture deliberately
# carries one row with a null account_id, which the onboarded dq_config rule
# (account_id IS NOT NULL, action: "fail") aborts the pipeline update on. A FAILED job run with
# `run_pipeline` as the failing task is this test case's correct, intended outcome, not a
# deployment defect. See metaflow_testing/031_dq_003_fail.json and docs/52_tc_dq_003.md.

resources:
  jobs:
    metaflow_test_dq_003_fail_job:
      name: Metaflow Test DQ-003 - fail Pipeline Execution Abort

      tasks:
        - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../../notebooks/01_setup/01_setup_control_tables.py
            base_parameters:
              catalog: metaflow
          environment_key: framework_env

        - task_key: seed_dq_003_fail_data
          depends_on:
            - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../../notebooks/00_seed_sample_data/03_seed_dq_003_fail_data.py
            base_parameters:
              catalog: metaflow
          environment_key: framework_env

        - task_key: onboard_dq_003
          depends_on:
            - task_key: seed_dq_003_fail_data
          notebook_task:
            notebook_path: ../../notebooks/02_onboarding/02_onboarding_engine.py
            base_parameters:
              spec_file_path: "${workspace.file_path}/metaflow_testing/031_dq_003_fail.json"
              catalog: metaflow
              env: dev
              action_type: CREATE
          environment_key: framework_env

        - task_key: run_pipeline
          depends_on:
            - task_key: onboard_dq_003
          pipeline_task:
            pipeline_id: ${resources.pipelines.metaflow_test_dq_003_fail_pipeline.id}

      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../../dist/*.whl
