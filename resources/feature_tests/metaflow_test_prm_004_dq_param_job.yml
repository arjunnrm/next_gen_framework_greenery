# Wraps metaflow_test_prm_004_dq_param_pipeline:
#
#   setup_control_tables -> seed_prm_004_dq_param_data -> onboard_prm_004 -> run_pipeline
#
# Self-contained and idempotent (control-table upsert + CREATE ... IF NOT EXISTS schema/volume
# provisioning + fixture re-copy), so this job can be re-run on its own at any time. See
# metaflow_testing/046_prm_004_dq_param.json and docs/68_tc_prm_004.md.

resources:
  jobs:
    metaflow_test_prm_004_dq_param_job:
      name: Metaflow Test PRM-004 - Parameterized DQ Rule Expressions

      tasks:
        - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../../notebooks/01_setup/01_setup_control_tables.py
            base_parameters:
              catalog: metaflow
          environment_key: framework_env

        - task_key: seed_prm_004_dq_param_data
          depends_on:
            - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../../notebooks/00_seed_sample_data/03_seed_prm_004_dq_param_data.py
            base_parameters:
              catalog: metaflow
          environment_key: framework_env

        - task_key: onboard_prm_004
          depends_on:
            - task_key: seed_prm_004_dq_param_data
          notebook_task:
            notebook_path: ../../notebooks/02_onboarding/02_onboarding_engine.py
            base_parameters:
              spec_file_path: "${workspace.file_path}/metaflow_testing/046_prm_004_dq_param.json"
              catalog: metaflow
              env: dev
              action_type: CREATE
          environment_key: framework_env

        - task_key: run_pipeline
          depends_on:
            - task_key: onboard_prm_004
          pipeline_task:
            pipeline_id: ${resources.pipelines.metaflow_test_prm_004_dq_param_pipeline.id}

      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../../dist/*.whl
