# TC-ING-006: "Nested JSON Struct Flattening (explode_columns)" -- Auto Loader ingestion of
# a JSON device-telemetry feed where each record carries a nested "metrics" array of
# {sensor, val} elements. source_config.explode_columns: ["metrics"] explicitly scopes the
# explode/flatten to that one array column (this session's new auto_flatten_all flag defaults
# explode to a schema-preserving pass-through, so explode_columns must be set explicitly --
# see metaflow_testing/015_ing_006_json_explode.json). Each device record's 2-element metrics
# array explodes into 2 rows, with metrics_sensor/metrics_val as discrete top-level columns.

resources:
  pipelines:
    metaflow_test_ing_006_json_explode_pipeline:
      name: metaflow_test_ing_006_json_explode_pipeline_${bundle.target}
      catalog: metaflow
      schema: bronze_iot
      serverless: true
      photon: true
      development: true
      continuous: false

      libraries:
        - notebook:
            path: ../../notebooks/03_engine/03_lakeflow_declarative_pipeline.py

      environment:
        dependencies:
          - ../../dist/*.whl

      configuration:
        dataflow.group.id: dfg_metaflow_ing_006_json_explode
        dataflow.control.catalog: metaflow
