# Metaflow test scenario 001: "ZIP file onboarding" -- 4 ZIP archives (departments, employees,
# projects, assignments) ingested via autoloader + source_zip_handling, joined into one Silver
# table, and exported back to a Volume as a ZIP archive (target_type: "external_sink",
# sink_config.format: "pgp_zip" with post_export_archive.pgp_encryption omitted -- a plain,
# unencrypted ZIP export; see archive/pgp_zip_sink.py and docs/23_lakeflow_sinks.md).
# Ingestion + transformation + sink, entirely in one Lakeflow Declarative Pipeline update.
#
# Targets the new `metaflow` catalog (control tables live in metaflow.config, same as every
# other metaflow_testing/*.json spec) -- see metaflow_testing/001_zip_file_onboarding.json and
# notebooks/00_seed_sample_data/02_seed_metaflow_testing_data.py for the fixture data.

resources:
  pipelines:
    metaflow_test_001_zip_join_export_pipeline:
      name: metaflow_test_001_zip_join_export_pipeline_${bundle.target}
      catalog: metaflow
      schema: bronze_ea
      serverless: true
      photon: true
      development: true
      continuous: false

      libraries:
        - notebook:
            path: ../../notebooks/03_engine/03_lakeflow_declarative_pipeline.py

      environment:
        dependencies:
          - ../../dist/*.whl

      configuration:
        dataflow.group.id: dfg_metaflow_001_zip_join_export
        dataflow.control.catalog: metaflow
