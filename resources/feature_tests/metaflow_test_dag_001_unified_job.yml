# Wraps metaflow_test_dag_001_unified_pipeline (TC-DAG-001, v1.5.0 Module 12):
#
#   setup_control_tables -> seed_metaflow_testing_data -> onboard_dag_001 -> run_pipeline_task
#     -> run_observability_task
#
# run_pipeline_task runs the unified pipeline once (ingestion + transformation + the
# pipeline-mode reconciliation flow all in one Lakeflow update); run_observability_task is a
# SEPARATE notebook_task depending on it, not a step baked into the pipeline itself -- the
# standard 4-task shape every dedicated test job in this bundle follows (see e.g.
# resources/observability/dlt_observability_job.yml / metaflow_test_obs_003_vol_export_job.yml). See
# metaflow_testing/049_dag_001_unified_three_flow.json and TESTING_PLAN.md's TC-DAG-001 row,
# which names exactly these two pipeline/job task keys.
#
# seed_metaflow_testing_data reuses the existing 02_seed_metaflow_testing_data.py notebook for
# control-table bootstrap parity with every other scenario in this bundle; it does NOT seed
# {{catalog}}.dag_001_usecase.shared_source_bus itself (no dedicated seed notebook for that
# table exists yet -- see the KNOWN LIMITATION note in
# metaflow_test_dag_001_unified_pipeline.yml). A live run of run_pipeline_task therefore needs
# that source table pre-populated out of band until a dedicated seed step is added.
#
# run_observability_task follows the PARAMETER CONTRACT documented in
# resources/observability/dlt_observability_job.yml (all four base_parameters required); this spec declares
# no "observability" destinations array yet, so this task is expected to fail loudly with "No
# enabled observability_config destinations resolved for dataflow_group_id=
# 'dfg_dag_001_unified_three_flow'" until one is added -- included now, failing loudly rather
# than silently, to keep this job's shape consistent with every other scenario in this bundle
# (R3: observability export stays a separate task, never folded into the pipeline).

resources:
  jobs:
    metaflow_test_dag_001_unified_job:
      name: Metaflow Test DAG-001 - Unified Read-Once Source Plane (Ingestion + Transformation + Reconciliation)

      tasks:
        - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../../notebooks/01_setup/01_setup_control_tables.py
            base_parameters:
              catalog: metaflow
          environment_key: framework_env

        - task_key: seed_metaflow_testing_data
          depends_on:
            - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../../notebooks/00_seed_sample_data/02_seed_metaflow_testing_data.py
            base_parameters:
              catalog: metaflow
          environment_key: framework_env

        # Delegated to the generic resources/metaflow_config_jobs/onboarding_job.yml -- the single parameterised
        # onboarding entrypoint for this bundle. Never inline a 02_onboarding_engine.py
        # notebook_task in a new job.
        - task_key: onboard_dag_001
          depends_on:
            - task_key: seed_metaflow_testing_data
          run_job_task:
            job_id: ${resources.jobs.onboarding_job.id}
            job_parameters:
              spec_file_path: "${workspace.file_path}/metaflow_testing/049_dag_001_unified_three_flow.json"
              catalog: metaflow
              env: dev
              action_type: CREATE

        - task_key: run_pipeline_task
          depends_on:
            - task_key: onboard_dag_001
          pipeline_task:
            pipeline_id: ${resources.pipelines.metaflow_test_dag_001_unified_pipeline.id}

        - task_key: run_observability_task
          depends_on:
            - task_key: run_pipeline_task
          notebook_task:
            notebook_path: ../../notebooks/08_observability/08_dlt_observability_engine.py
            base_parameters:
              # All four are REQUIRED -- see resources/observability/dlt_observability_job.yml's PARAMETER
              # CONTRACT note. This spec has no "observability" destinations configured yet
              # (see this file's header comment), so this task is expected to fail until one is
              # added.
              dataflow_group_id: dfg_dag_001_unified_three_flow
              catalog: metaflow
              env: dev
              pipeline_task_run_id: "{{tasks.run_pipeline_task.run_id}}"
              service_name: dlt-observability-metaflow-test-dag-001
              fail_task_on_dispatch_error: "true"
          environment_key: framework_env

      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../../dist/*.whl
