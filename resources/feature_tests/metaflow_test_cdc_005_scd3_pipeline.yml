# TC-CDC-005: "SCD Type 3 Current & Previous State (SCD3)" -- proves cdc_load_strategy "SCD3"
# tracks only the current and immediately-previous value of a monitored column
# (current_status/previous_status) as subscription S100 advances TRIAL -> ACTIVE -> CHURNED
# across 3 separately-landed batches and 3 separate pipeline updates. Wraps both the raw
# ingestion flow (df_cdc_005_subscription_events_ingest, APPEND into bronze_sub) and the
# downstream SCD3 transformation flow (ts_cdc_005_scd3_subscription, silver_sub) in the same
# pipeline/dataflow_group, since SCD3 is only valid for transformation_flows and needs a bronze
# source to read incrementally from. See metaflow_testing/023_cdc_005_scd3.json and
# docs/44_tc_cdc_005.md.

resources:
  pipelines:
    metaflow_test_cdc_005_scd3_pipeline:
      name: metaflow_test_cdc_005_scd3_pipeline_${bundle.target}
      catalog: metaflow
      schema: bronze_sub
      serverless: true
      photon: true
      development: true
      continuous: false

      libraries:
        - notebook:
            path: ../../notebooks/03_engine/03_lakeflow_declarative_pipeline.py

      environment:
        dependencies:
          - ../../dist/*.whl

      configuration:
        dataflow.group.id: dfg_cdc_005_scd3_subscription
        dataflow.control.catalog: metaflow
