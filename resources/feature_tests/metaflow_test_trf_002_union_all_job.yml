# Wraps metaflow_test_trf_002_union_all_pipeline:
#
#   setup_control_tables -> seed_trf_002_union_all_data -> onboard_trf_002 -> run_pipeline
#
# Self-contained and idempotent (control-table upsert + CREATE ... IF NOT EXISTS schema/volume
# provisioning + idempotent fixture re-landing), so this job can be re-run on its own at any
# time. See metaflow_testing/027_trf_002_union_all.json and docs/48_tc_trf_002.md.

resources:
  jobs:
    metaflow_test_trf_002_union_all_job:
      name: Metaflow Test TRF-002 - Multi-Regional UNION ALL Consolidation

      tasks:
        - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../../notebooks/01_setup/01_setup_control_tables.py
            base_parameters:
              catalog: metaflow
          environment_key: framework_env

        - task_key: seed_trf_002_union_all_data
          depends_on:
            - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../../notebooks/00_seed_sample_data/03_seed_trf_002_union_all_data.py
            base_parameters:
              catalog: metaflow
          environment_key: framework_env

        - task_key: onboard_trf_002
          depends_on:
            - task_key: seed_trf_002_union_all_data
          notebook_task:
            notebook_path: ../../notebooks/02_onboarding/02_onboarding_engine.py
            base_parameters:
              spec_file_path: "${workspace.file_path}/metaflow_testing/027_trf_002_union_all.json"
              catalog: metaflow
              env: dev
              action_type: CREATE
          environment_key: framework_env

        - task_key: run_pipeline
          depends_on:
            - task_key: onboard_trf_002
          pipeline_task:
            pipeline_id: ${resources.pipelines.metaflow_test_trf_002_union_all_pipeline.id}

      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../../dist/*.whl
