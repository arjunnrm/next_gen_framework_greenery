# TC-CDC-001: "Streaming Append-Only Fact Loading (APPEND)" -- proves cdc_load_strategy
# "APPEND" appends every clickstream event verbatim into a Bronze streaming table, including
# rows that share an identical (user_id, event_timestamp) pair across the same or different
# landed files/micro-batches -- no deduplication, no history tracking, no hash columns (APPEND
# has no CDC comparison concept). See metaflow_testing/019_cdc_001_append.json and
# docs/40_tc_cdc_001.md.

resources:
  pipelines:
    metaflow_test_cdc_001_append_pipeline:
      name: metaflow_test_cdc_001_append_pipeline_${bundle.target}
      catalog: metaflow
      schema: bronze_web
      serverless: true
      photon: true
      development: true
      continuous: false

      libraries:
        - notebook:
            path: ../../notebooks/03_engine/03_lakeflow_declarative_pipeline.py

      environment:
        dependencies:
          - ../../dist/*.whl

      configuration:
        dataflow.group.id: dfg_cdc_001_append
        dataflow.control.catalog: metaflow
