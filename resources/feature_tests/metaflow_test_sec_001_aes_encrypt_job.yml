# Wraps metaflow_test_sec_001_aes_encrypt_pipeline:
#
#   setup_control_tables -> seed_sec_001_aes_encrypt_data -> onboard_sec_001 -> run_pipeline
#
# Self-contained and idempotent (control-table upsert + CREATE ... IF NOT EXISTS schema/volume
# provisioning + idempotent fixture copy), so this job can be re-run on its own at any time.
# Requires the same {{catalog}}.security.pii_encryption_key Unity Catalog secret every other
# encryption scenario in this project depends on (see docs/05_deployment_guide.md §0) -- this
# job does not provision it.

resources:
  jobs:
    metaflow_test_sec_001_aes_encrypt_job:
      name: Metaflow Test SEC-001 - AES-GCM Column Encryption

      tasks:
        - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../../notebooks/01_setup/01_setup_control_tables.py
            base_parameters:
              catalog: metaflow
          environment_key: framework_env

        - task_key: seed_sec_001_aes_encrypt_data
          depends_on:
            - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../../notebooks/00_seed_sample_data/03_seed_sec_001_aes_encrypt_data.py
            base_parameters:
              catalog: metaflow
          environment_key: framework_env

        - task_key: onboard_sec_001
          depends_on:
            - task_key: seed_sec_001_aes_encrypt_data
          notebook_task:
            notebook_path: ../../notebooks/02_onboarding/02_onboarding_engine.py
            base_parameters:
              spec_file_path: "${workspace.file_path}/metaflow_testing/033_sec_001_aes_encrypt.json"
              catalog: metaflow
              env: dev
              action_type: CREATE
          environment_key: framework_env

        - task_key: run_pipeline
          depends_on:
            - task_key: onboard_sec_001
          pipeline_task:
            pipeline_id: ${resources.pipelines.metaflow_test_sec_001_aes_encrypt_pipeline.id}

      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../../dist/*.whl
