# TC-TRF-001: "Multi-Source Streaming-to-Batch 4-Way Inner Join" -- 1 streaming Auto Loader
# fact table (assignments_raw) inner-joined against 3 batch-read dimension tables
# (employees_raw/departments_raw/projects_raw), all landed by this same pipeline's own
# ingestion flows. Employee E005 exists in employees_raw but has no assignments_raw row, so
# the inner join must exclude it -- exactly 5 matched rows expected. Reuses scenario 001's own
# join-SQL pattern verbatim (see metaflow_test_001_zip_join_export_pipeline.yml), but against
# this test case's own dedicated bronze/silver tables (trf001_* names, plain-CSV-landed, not
# ZIP-extracted) so this pipeline never collides with scenario 001's already-deployed
# bronze_ea.assignments_raw/employees_raw/departments_raw/projects_raw or
# silver_ea.ea_joined_assignments objects -- see metaflow_testing/026_trf_001_4way_join.json
# and docs/47_tc_trf_001.md for the full naming-collision rationale.
#
# Targets the `metaflow` catalog (control tables live in metaflow.config, same as every other
# metaflow_testing/*.json spec).

resources:
  pipelines:
    metaflow_test_trf_001_4way_join_pipeline:
      name: metaflow_test_trf_001_4way_join_pipeline_${bundle.target}
      catalog: metaflow
      schema: bronze_ea
      serverless: true
      photon: true
      development: true
      continuous: false

      libraries:
        - notebook:
            path: ../../notebooks/03_engine/03_lakeflow_declarative_pipeline.py

      environment:
        dependencies:
          - ../../dist/*.whl

      configuration:
        dataflow.group.id: dfg_metaflow_trf_001_4way_join
        dataflow.control.catalog: metaflow
