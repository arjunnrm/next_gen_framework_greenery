# Wraps metaflow_test_prm_001_path_param_pipeline:
#
#   setup_control_tables -> seed_prm_001_path_param_data -> onboard_prm_001 -> run_prm_001_pipeline
#
# Self-contained: seeds its own dedicated finance_ops/bronze_finance schemas + finance_ops.landing
# Volume fixture (4 daily transaction records, landed under the date-partitioned
# .../landing/2026-08-28/ path the ${data_domain}/${batch_date} substitution is expected to
# resolve to) rather than reusing any other scenario's fixtures, since no existing seeded
# table/volume carries this parameterized-path shape. See
# notebooks/00_seed_sample_data/03_seed_prm_001_path_param_data.py and
# metaflow_testing/045_prm_001_path_param.json.

resources:
  jobs:
    metaflow_test_prm_001_path_param_job:
      name: Metaflow Test TC-PRM-001 - Parameterized Dynamic Volume & File Paths

      tasks:
        - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../../notebooks/01_setup/01_setup_control_tables.py
            base_parameters:
              catalog: metaflow
          environment_key: framework_env

        - task_key: seed_prm_001_path_param_data
          depends_on:
            - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../../notebooks/00_seed_sample_data/03_seed_prm_001_path_param_data.py
            base_parameters:
              catalog: metaflow
              data_domain: finance_ops
              batch_date: "2026-08-28"
          environment_key: framework_env

        - task_key: onboard_prm_001
          depends_on:
            - task_key: seed_prm_001_path_param_data
          notebook_task:
            notebook_path: ../../notebooks/02_onboarding/02_onboarding_engine.py
            base_parameters:
              spec_file_path: "${workspace.file_path}/metaflow_testing/045_prm_001_path_param.json"
              catalog: metaflow
              env: dev
              action_type: CREATE
          environment_key: framework_env

        - task_key: run_prm_001_pipeline
          depends_on:
            - task_key: onboard_prm_001
          pipeline_task:
            pipeline_id: ${resources.pipelines.metaflow_test_prm_001_path_param_pipeline.id}

      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../../dist/*.whl
