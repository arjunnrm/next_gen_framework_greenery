# Wraps metaflow_test_ing_001_zip_filter_pipeline:
#
#   setup_control_tables -> seed_ing_001_zip_filter_data -> onboard_ing_001 -> run_pipeline
#
# Self-contained and idempotent (control-table upsert + CREATE ... IF NOT EXISTS schema/volume
# provisioning + idempotent ZIP regeneration), so this job can be re-run on its own at any time.
# See metaflow_testing/010_ing_001_zip_filter.json and docs/31_tc_ing_001.md.

resources:
  jobs:
    metaflow_test_ing_001_zip_filter_job:
      name: Metaflow Test ING-001 - Selective Glob Pattern ZIP Extraction

      tasks:
        - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../notebooks/01_setup/01_setup_control_tables.py
            base_parameters:
              catalog: metaflow
          environment_key: framework_env

        - task_key: seed_ing_001_zip_filter_data
          depends_on:
            - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../notebooks/00_seed_sample_data/03_seed_ing_001_zip_filter_data.py
            base_parameters:
              catalog: metaflow
          environment_key: framework_env

        - task_key: onboard_ing_001
          depends_on:
            - task_key: seed_ing_001_zip_filter_data
          notebook_task:
            notebook_path: ../notebooks/02_onboarding/02_onboarding_engine.py
            base_parameters:
              spec_file_path: "${workspace.file_path}/metaflow_testing/010_ing_001_zip_filter.json"
              catalog: metaflow
              env: dev
              action_type: CREATE
          environment_key: framework_env

        - task_key: run_pipeline
          depends_on:
            - task_key: onboard_ing_001
          pipeline_task:
            pipeline_id: ${resources.pipelines.metaflow_test_ing_001_zip_filter_pipeline.id}

      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl
