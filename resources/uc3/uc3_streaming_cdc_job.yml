# Runs the UC3 Excalibur streaming-CDC group:
#
#   run_pipeline_update -> observability_export
#
# This is a RUN job, not a provisioning job. Since 2026-09-08 the one-time steps live in their
# own jobs so this one carries only what every run needs:
#
#   resources/uc3/uc3_seed_job.yml        setup_control_tables -> onboard both UC3 specs
#   resources/uc3/uc3_governance_job.yml  ALTER TABLE ... SET TAGS for both UC3 groups
#
# Order for a fresh workspace: uc3_seed_job once, then 003 (simulator), 004 (this job), 005
# (batch recon), then uc3_governance_job once the tables exist -- and again after any change
# to a spec's governance_tags, because tags are applied from the control-table rows, not the
# file. The same two-task shape as resources/sample_jobs/*_job.yml, whose layout test pins it.
#
# What the pipeline needs at runtime is exactly two spark.conf keys (set in
# uc3_streaming_cdc_pipeline.yml) plus active control-table rows for the group; it never runs
# setup, onboarding or governance itself. The additive control-table migration
# (ensure_control_table_columns) runs inside the onboarding engine, not in 01_setup, so a run
# job gains nothing from re-running setup on every trigger.
#
# ONBOARDING IS DELEGATED, NEVER INLINED. The seed job is a run_job_task against the generic
# resources/flowx_config_jobs/onboarding_job.yml -- the single parameterised onboarding
# entrypoint for the whole bundle (BUILD_CONTRACT.md section 7, and the repo's standing rule).
#
# JOB TAGS STAY. `dataflow_group_id` is the ONLY way a Lakeflow job run is attributed back to
# its FlowX dataflow group in the system tables (flowx.observability.v_job_runs,
# system.billing.usage). No pipeline in this bundle sets tags; the job tag is the join key.
#
# PARAMETER CONTRACT for observability_export: pipeline_task_run_id must be a TASK
# base_parameter, never a pipeline configuration: key. `{{tasks.<key>.run_id}}` is a Jobs
# dynamic value resolved per job run, and a mistyped task_key is passed through as literal text
# rather than failing at the platform layer -- runtime_params.py detects exactly that and names
# it. The key below is `run_pipeline_update`, which is the task_key declared in this same file.
# The task also cross-checks dataflow_group_id against the pipeline it observed and fails if
# they disagree, which catches a copy-paste left pointing at the job it came from.
#
# NAME: 004_lfj_uc3_excalibur_streaming_cdc, driving pipeline 004_ldp_uc3_excalibur_streaming_cdc
# -- both 004, deliberately (BUILD_CONTRACT.md section 2).

resources:
  jobs:
    uc3_streaming_cdc_job:
      name: 004_lfj_uc3_excalibur_streaming_cdc
      tags:
        dataflow_group_id: dfg_uc3_excalibur_streaming_cdc
        framework: flowx
      tasks:
        - task_key: run_pipeline_update
          pipeline_task:
            pipeline_id: ${resources.pipelines.uc3_streaming_cdc_pipeline.id}
        - task_key: observability_export
          depends_on:
            - task_key: run_pipeline_update
          notebook_task:
            notebook_path: ../../notebooks/08_observability/08_dlt_observability_engine.py
            base_parameters:
              dataflow_group_id: dfg_uc3_excalibur_streaming_cdc
              catalog: ${var.catalog}
              env: ${bundle.target}
              pipeline_task_run_id: "{{tasks.run_pipeline_update.run_id}}"
              service_name: dlt-observability-uc3-excalibur-streaming-cdc
              fail_task_on_dispatch_error: "true"
          environment_key: framework_env
      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../../dist/*.whl
