# Runs the UC3 Excalibur batch-load + reconciliation group:
#
#   run_pipeline_update -> observability_export
#
# This is a RUN job, not a provisioning job. Since 2026-09-08 the one-time steps live in their
# own jobs so this one carries only what every run needs (see the header of
# uc3_streaming_cdc_job.yml for the full rationale):
#
#   resources/uc3/uc3_seed_job.yml        setup_control_tables -> onboard both UC3 specs
#   resources/uc3/uc3_governance_job.yml  ALTER TABLE ... SET TAGS for both UC3 groups
#
# THE THREE heal_* TASKS ARE GONE (v0.0.7). Healing now runs INSIDE the pipeline update above,
# as declarative graph nodes. The three reconciliation flows moved from
# `execution_mode: "pipeline_audit_only"` to `"pipeline"` with the new
# `heal_trigger: "update_pulse"`, which registers a `dlt.create_sink(format="delta")` +
# `@dlt.append_flow` per healing target -- appending the miss set into
# `{{catalog}}.staging.oracle_excalibur_cdc` as part of the same update that computed it.
#
# WHY THIS IS NOW POSSIBLE, having previously been impossible. `"pipeline"` used to STREAM the
# reconciliation source to drive the heal lane, and this source cannot be streamed: the recon
# source `staging.<table>_batch` is a TRUNCATE_AND_LOAD materialized view (source_plane's
# G-STREAM guard rejects it) and the Lakeflow Connect table behind it is MERGE-written (Delta
# refuses to stream it). `heal_trigger: "update_pulse"` decouples the TRIGGER from the PAYLOAD --
# the same split `sink_config.export_trigger: "per_update"` already uses for sink exports
# (v1.7.5): a shared `rate-micro-batch` pulse carrying no data makes the append flow genuinely
# streaming, while the miss set joins in as a BATCH `dlt.read`. NOTHING streams the source, so
# its write pattern stops mattering.
#
# The G-STREAM guard is NOT relaxed generally -- it still rejects `heal_trigger: "source_stream"`
# (the default) against a non-append-only producer. See tests/unit/
# test_recon_heal_trigger_update_pulse.py, which pins exactly that.
#
# A healed row re-enters through the SAME CDC engine as any real Oracle change: the append lands
# in the Debezium landing table with a synthetic `heal_scn` (MAX existing SCN + 1) so
# `apply_changes` treats it as the newest version, and the 004 streaming lane picks it up on its
# next update. Not a second MERGE.
#
# RUNTIME DEPENDENCY: this job must run AFTER 004_lfj_uc3_excalibur_streaming_cdc. The
# reconciliation compares each batch table against <catalog>.bronze.<table>, which does not
# exist until Job 2's pipeline has published it. Phase C order is Job 1 -> Job 2 -> Job 3, and
# the three UC3 jobs must NOT be parallelised.
#
# The observability_export task is ALSO the only writer of this group's reconciliation_run_log
# rows on an update where the healing lane produced no pulse -- keep it, it is not optional
# telemetry (observability/reconciliation_export.py).
#
# JOB TAGS STAY: `dataflow_group_id` is the join key from system tables back to this group.
#
# NAME: 005_lfj_uc3_excalibur_batch_recon, driving pipeline 006_ldp_uc3_excalibur_batch_recon.

resources:
  jobs:
    uc3_batch_recon_job:
      name: 005_lfj_uc3_excalibur_batch_recon
      tags:
        dataflow_group_id: dfg_uc3_excalibur_batch_recon
        framework: flowx
      tasks:
        - task_key: run_pipeline_update
          pipeline_task:
            pipeline_id: ${resources.pipelines.uc3_batch_recon_pipeline.id}

        - task_key: observability_export
          depends_on:
            - task_key: run_pipeline_update
          notebook_task:
            notebook_path: ../../notebooks/08_observability/08_dlt_observability_engine.py
            base_parameters:
              dataflow_group_id: dfg_uc3_excalibur_batch_recon
              catalog: ${var.catalog}
              env: ${bundle.target}
              pipeline_task_run_id: "{{tasks.run_pipeline_update.run_id}}"
              service_name: dlt-observability-uc3-excalibur-batch-recon
              fail_task_on_dispatch_error: "true"
          environment_key: framework_env
      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../../dist/*.whl
