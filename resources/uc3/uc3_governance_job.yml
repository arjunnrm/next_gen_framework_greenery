# Governance tagging for both UC3 Excalibur groups, in ONE task:
#
#   tag_uc3_groups   (dataflow_group_id = "dfg_uc3_excalibur_streaming_cdc,dfg_uc3_excalibur_batch_recon")
#
# MULTI-GROUP (v0.0.7). `04_apply_governance_and_egress.py`'s `dataflow_group_id` widget accepts a
# COMMA-SEPARATED LIST, so the two groups that used to need two chained tasks are now one task.
# This replaces the previous `tag_streaming_cdc -> tag_batch_recon` pair. The notebook applies each
# group independently and, if one fails, still attempts the rest before failing the task with every
# failing group named -- so combining them does not let one group's failure hide another's tags.
#
# Adding a third UC3 group is now an edit to the comma-separated string below, not a new task.
#
# GOVERNANCE TAGGING IS A POST-MATERIALIZATION STEP and cannot live in the pipeline graph. The
# framework applies `governance_tags` via governance/tags.py::apply_all_governance_tags, which
# issues ALTER TABLE ... SET TAGS / ALTER COLUMN ... SET TAGS against tables that ALREADY exist.
# Run this job:
#
#   * once after the first successful 004 and 005 pipeline updates (the tables must exist), and
#   * again after any change to a spec's governance_tags -- AFTER re-running uc3_seed_job,
#     because tags are read from the control-table rows the onboarding wrote, not from the file.
#
# Phase C proved why a dedicated job is needed: Job 2 once succeeded end to end with zero tags
# in information_schema.column_tags, because no task ever invoked this notebook. Moving the
# step out of the run jobs (2026-09-08) must not recreate that gap -- hence this job.
#
# The tag VALUES come from the spec's governance_tags block and must match the governed tag
# policies in BT_Usecase/UC3/onboarding/uc3_governed_tags.sql (created once per metastore by a
# metastore admin). Neither the validator nor tags.py checks values against a policy, so a
# spelling that is not an ALLOWED_VALUE fails here, at SET TAGS time.

resources:
  jobs:
    uc3_governance_job:
      name: 009_lfj_uc3_excalibur_governance
      tags:
        framework: flowx
        use_case: uc3
      tasks:
        - task_key: tag_uc3_groups
          notebook_task:
            notebook_path: ../../notebooks/04_governance/04_apply_governance_and_egress.py
            base_parameters:
              catalog: ${var.catalog}
              # Comma-separated list -- one task, both groups. Order is preserved.
              dataflow_group_id: dfg_uc3_excalibur_streaming_cdc,dfg_uc3_excalibur_batch_recon
              apply_abac: "true"
              capture_cdc_change_counts: "false"
          environment_key: framework_env
      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../../dist/*.whl
