# TC4 (v0.0.2) -- "Metrics ON": the telemetry-ON half of the TC4/TC5 matched pair.
# Spec: metaflow_testing/v0_0_2_tc4_metrics_on.json
#
# The pair exists to compare functional parity and runtime cost between the two
# reconciliation telemetry modes. This pipeline's reconciliation flow sets
# logging_config {run_log_capture: true, mismatch_log_capture: true}; the TC5 pipeline sets
# both false. Everything else about the two is identical.
#
# THIS PIPELINE AND THE TC5 PIPELINE MUST STAY SEPARATE RESOURCES. A Lakeflow dataset has
# exactly one owning pipeline, and the two specs deliberately declare different
# dataflow_group_ids and different target schemas/tables so their control-table rows and their
# published tables never collide. One pipeline per dataflow group, by construction.
#
# schema is the DEFAULT publishing schema for datasets whose spec does not name one; every
# flow in this spec carries an explicit target_schema (bronze_tc4_metrics / silver_tc4_metrics),
# so this value only backstops the pipeline-registered reconciliation datasets.

resources:
  pipelines:
    metaflow_test_v0_0_2_tc4_metrics_on_pipeline:
      name: metaflow_test_v0_0_2_tc4_metrics_on_pipeline_${bundle.target}
      catalog: metaflow
      schema: bronze_tc4_metrics
      serverless: true
      photon: true
      development: true
      continuous: false

      libraries:
        - notebook:
            path: ../../notebooks/03_engine/03_lakeflow_declarative_pipeline.py

      environment:
        dependencies:
          - ../../dist/*.whl

      configuration:
        dataflow.group.id: dfg_v0_0_2_tc4_metrics_on
        dataflow.control.catalog: metaflow
