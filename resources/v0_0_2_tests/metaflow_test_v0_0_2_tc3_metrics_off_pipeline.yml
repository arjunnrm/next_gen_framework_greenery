# v0.0.2 TEST CASE 3 -- "Batch + CDC + SQL Transformation + JSON conversion + Delta append,
# with LOGS OFF and METRICS OFF".
#
# One unified Lakeflow update carries all five stages of the batch path:
#   (a) two Auto Loader CSV batch ingests -> bronze_tc3.tc3_orders_bronze /
#       bronze_tc3.tc3_order_status_bronze
#   (d) order_payload (a JSON document in a STRING column) converted to a NATIVE struct by
#       source_config.json_string_columns  -- the framework's real mechanism
#       (ingestion/json_flattening.py::parse_json_string_columns), not an invented key
#   (b) cdc_load_strategy SCD1 -> silver_tc3.tc3_order_current, resolving latest record state
#       (inserts/updates in place, cdc_op 'D'/'DELETE' removed via apply_as_deletes)
#   (c) a custom transformation_sql join with column mappings, a WHERE filter and derivations
#   (e) APPEND into the silver_tc3.tc3_order_enriched Delta table
# plus a pipeline-mode reconciliation flow comparing (e) against the status Bronze table.
#
# TELEMETRY IS DORMANT BY DESIGN. The reconciliation flow declares
# logging_config: {run_log_capture: false, mismatch_log_capture: false} explicitly, so a run of
# this pipeline must produce ZERO reconciliation_run_log rows, ZERO mismatch-log rows and NO
# recon__*__metrics dataset at all. That is the assertion the test case exists to make -- see
# metaflow_testing/v0_0_2_tc3_batch_cdc_sql_metrics_off.json's _metrics_off_contract note.
#
# `schema:` is bronze_tc3 (the pipeline's default publishing schema); the two Silver targets
# name their own target_schema in the spec, exactly as every other multi-schema scenario in
# this bundle does.
#
# Seed prerequisite: notebooks/00_seed_sample_data/03_seed_v0_0_2_tc3_batch_cdc_sql_data.py
# creates the tc3_usecase schema, both landing Volumes, and the two source CSVs. The job
# resource runs it as a task; a manual pipeline run needs it run first.

resources:
  pipelines:
    metaflow_test_v0_0_2_tc3_metrics_off_pipeline:
      name: metaflow_test_v0_0_2_tc3_metrics_off_pipeline_${bundle.target}
      catalog: metaflow
      schema: bronze_tc3
      serverless: true
      photon: true
      development: true
      continuous: false

      libraries:
        - notebook:
            path: ../../notebooks/03_engine/03_lakeflow_declarative_pipeline.py

      environment:
        dependencies:
          - ../../dist/*.whl

      configuration:
        dataflow.group.id: dfg_v0_0_2_tc3_metrics_off
        dataflow.control.catalog: metaflow
