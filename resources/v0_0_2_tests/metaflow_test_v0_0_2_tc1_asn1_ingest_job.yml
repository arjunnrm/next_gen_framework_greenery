# Wraps metaflow_test_v0_0_2_tc1_asn1_ingest_pipeline:
#
#   setup_control_tables -> seed_psgw_asn1_fixture -> onboard_tc1_asn1_ingest -> run_tc1_asn1_ingest_pipeline
#
# seed_psgw_asn1_fixture (notebooks/00_seed_sample_data/04_seed_asn1_psgw_cdr_fixture.py) lands
# the real PSGW ASN.1 module file at /Volumes/metaflow/psgw/schemas/PSGW.asn1, then generates 10
# genuine BER-encoded CallEventRecord fixtures directly on-cluster into
# /Volumes/metaflow/psgw/landing_cdr/incoming/ -- binary files do not survive Databricks
# Workspace Files sync reliably. Crucially it writes ONE RECORD PER FILE: the framework decoder
# decodes a whole file's bytes as a single record, so a concatenated multi-record .ber (which is
# what BT_Testing/synthetic/psgw_synthetic.ber is) would ingest 1 row and silently drop 9. The
# notebook self-checks that invariant before finishing. Idempotent, so this job can be re-run.
#
# onboard_tc1_asn1_ingest DELEGATES to the generic onboarding_job via run_job_task rather than
# inlining a 02_onboarding_engine.py notebook_task, which is the pattern the older per-suite job
# files use and which this suite deliberately does not copy.

resources:
  jobs:
    metaflow_test_v0_0_2_tc1_asn1_ingest_job:
      name: Metaflow Test v0.0.2 - TC1 ASN.1 Ingestion and Schema Validation

      tasks:
        - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../../notebooks/01_setup/01_setup_control_tables.py
            base_parameters:
              catalog: metaflow
          environment_key: framework_env

        - task_key: seed_psgw_asn1_fixture
          depends_on:
            - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../../notebooks/00_seed_sample_data/04_seed_asn1_psgw_cdr_fixture.py
            base_parameters:
              catalog: metaflow
          environment_key: framework_env

        - task_key: onboard_tc1_asn1_ingest
          depends_on:
            - task_key: seed_psgw_asn1_fixture
          run_job_task:
            job_id: ${resources.jobs.onboarding_job.id}
            job_parameters:
              spec_file_path: "${workspace.file_path}/metaflow_testing/v0_0_2_tc1_asn1_ingest.json"
              catalog: metaflow
              env: dev
              action_type: CREATE

        - task_key: run_tc1_asn1_ingest_pipeline
          depends_on:
            - task_key: onboard_tc1_asn1_ingest
          pipeline_task:
            pipeline_id: ${resources.pipelines.metaflow_test_v0_0_2_tc1_asn1_ingest_pipeline.id}

      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../../dist/*.whl
