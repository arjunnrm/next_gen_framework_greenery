# v0.0.2 TEST CASE 1: "Ingestion & Schema Validation for ASN.1 Source" -- decodes real
# BER-encoded PSGW packet-gateway call-event records (source_type: "asn1") against the real
# metaflow_testing/BT_Testing/PSGW.asn1 module into metaflow.bronze_psgw.psgw_cdr_raw.
#
# PSGW's root PDU CallEventRecord is a CHOICE (13 arms), so this pipeline exercises the v0.0.2
# CHOICE-root support: the decoded frame carries one nullable column per arm plus the synthetic
# "_choice" discriminator naming the arm actually selected. All 10 fixtures select pGWRecord.
#
# See metaflow_testing/v0_0_2_tc1_asn1_ingest.json (spec, expected result, and the note on why
# asn1_pdu_name is set explicitly rather than auto-detected).

resources:
  pipelines:
    metaflow_test_v0_0_2_tc1_asn1_ingest_pipeline:
      name: metaflow_test_v0_0_2_tc1_asn1_ingest_pipeline_${bundle.target}
      catalog: metaflow
      schema: bronze_psgw
      serverless: true
      photon: true
      development: true
      continuous: false

      libraries:
        - notebook:
            path: ../../notebooks/03_engine/03_lakeflow_declarative_pipeline.py

      environment:
        dependencies:
          - ../../dist/*.whl

      configuration:
        dataflow.group.id: dfg_v0_0_2_tc1_asn1_ingest
        dataflow.control.catalog: metaflow
