# v0.0.2 ASN.1 EMSC pipeline -- decodes real BER-encoded EMSC mobile-switching-centre call data
# records (source_type: "asn1") against the real metaflow_testing/BT_Testing/EMSC.asn1 module into
# metaflow.bronze_emsc.emsc_cdr_raw.
#
# The spec OMITS asn1_pdu_name, so asn1/decoder.py::detect_root_pdu_name resolves the root PDU from
# the module itself: EMSC.asn1 -> CallDataRecord, a 2-arm CHOICE. The decoded frame therefore
# carries one nullable column per arm (uMTSGSMPLMNCallDataRecord, compositeCallDataRecord) plus the
# synthetic "_choice" discriminator naming the arm actually selected. All 10 fixtures select
# uMTSGSMPLMNCallDataRecord.
#
# Isolated from every other protocol pipeline: its own dataflow group (dfg_v0_0_2_asn1_emsc), its
# own schema (bronze_emsc) and its own /Volumes/metaflow/emsc/... volume tree.
#
# See metaflow_testing/v0_0_2_asn1_emsc.json for the spec, the expected result, and the note on why
# the DQ rules assert so little (both members of the selected arm are OPTIONAL and genuinely sparse).

resources:
  pipelines:
    metaflow_asn1_v0_0_2_emsc_pipeline:
      name: metaflow_asn1_v0_0_2_emsc_pipeline_${bundle.target}
      catalog: metaflow
      schema: bronze_emsc
      serverless: true
      photon: true
      development: true
      continuous: false

      libraries:
        - notebook:
            path: ../../notebooks/03_engine/03_lakeflow_declarative_pipeline.py

      environment:
        dependencies:
          - ../../dist/*.whl

      configuration:
        dataflow.group.id: dfg_v0_0_2_asn1_emsc
        dataflow.control.catalog: metaflow
