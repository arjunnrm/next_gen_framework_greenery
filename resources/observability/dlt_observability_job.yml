# Demonstrates wiring the DLT observability engine (notebooks/08_observability/) as a
# downstream Workflow task, chained after a pipeline_task via `depends_on` so
# `{{tasks.run_pipeline_update.run_id}}` can be passed straight through as a base_parameter:
#
#   setup_control_tables -> onboard_100 -> run_pipeline_update -> observability_export
#
# PARAMETER CONTRACT (v1.4.0). The observability task takes FOUR required base_parameters --
# dataflow_group_id, catalog, env, pipeline_task_run_id -- validated together by
# observability/runtime_params.py before the task makes a single API call. Two notes on the
# fourth, which is the only one the platform (not a human) supplies:
#
#   * It is `pipeline_task_run_id`, renamed from `run_pipeline_update_run_id`. The old name
#     encoded one convention -- a task_key literally called `run_pipeline_update` -- into the
#     parameter name, which then read as a lie in every job whose pipeline task is called
#     something else. The value is the run id of whichever pipeline_task this one depends_on.
#   * It is a TASK parameter and must NOT be declared in the pipeline's `configuration:` /
#     pipeline_parameters block. `{{tasks.<key>.run_id}}` is a Jobs dynamic value reference,
#     substituted per JOB RUN when this task is dispatched. Pipeline parameters are resolved per
#     PIPELINE UPDATE and are static for that deployment -- there is no job run in scope for one
#     to resolve against, so declaring it there cannot work and would at best pin every run to a
#     stale literal. Nothing about the pipeline resource changes to support this task.
#
# A mistyped task_key does not fail loudly on its own: the Jobs service substitutes nothing and
# passes the literal "{{tasks.<typo>.run_id}}" text through as the parameter value.
# runtime_params.py checks for exactly that and names it.
#
# Destinations come from the SAME onboarding spec as everything else -- see the
# "observability": [...] array in flowx_testing/100_zipcsv_onbaording.json, upserted into
# observability_config by onboard_100 alongside its ingestion_flows -- there is no separate
# seed step or config file (see docs/25_dlt_observability_module.md).
#
# Reuses the existing flowx_test_100_zipcsv_pipeline (see
# resources/feature_tests/flowx_test_100_zipcsv_pipeline.yml) rather than defining a new pipeline --
# referencing an already-defined pipeline resource from a second job is ordinary DAB usage and
# keeps this file purely additive (no existing resources/*.yml touched). To add observability
# to any OTHER existing job in this project, add an "observability": [...] array to that job's
# own onboarding spec, then copy the `observability_export` task block below into that job's
# `tasks:` list, add `depends_on: [{task_key: run_pipeline_update}]` (or whatever that job's
# pipeline_task's task_key actually is), set `pipeline_task_run_id:
# "{{tasks.<that task_key>.run_id}}"` to match, and set `dataflow_group_id` to that spec's own
# group id -- the task cross-checks it against the pipeline it observed and fails if they
# disagree, which is what catches a copy-paste left pointing at the job it came from.

resources:
  jobs:
    dlt_observability_job:
      name: FlowX Test 100 - ZIP CSV + DLT Observability Export

      tasks:
        - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../../notebooks/01_setup/01_setup_control_tables.py
            base_parameters:
              catalog: flowx
          environment_key: framework_env

        - task_key: onboard_100
          depends_on:
            - task_key: setup_control_tables
          notebook_task:
            notebook_path: ../../notebooks/02_onboarding/02_onboarding_engine.py
            base_parameters:
              spec_file_path: "${workspace.file_path}/flowx_testing/100_zipcsv_onbaording.json"
              catalog: flowx
              env: dev
              action_type: CREATE
          environment_key: framework_env

        - task_key: run_pipeline_update
          depends_on:
            - task_key: onboard_100
          pipeline_task:
            pipeline_id: ${resources.pipelines.flowx_test_100_zipcsv_pipeline.id}

        - task_key: observability_export
          depends_on:
            - task_key: run_pipeline_update
          notebook_task:
            notebook_path: ../../notebooks/08_observability/08_dlt_observability_engine.py
            base_parameters:
              # All four are REQUIRED -- see the PARAMETER CONTRACT note at the top of this file.
              dataflow_group_id: dfg_zip_csv_dataload
              catalog: flowx
              env: dev
              pipeline_task_run_id: "{{tasks.run_pipeline_update.run_id}}"
              service_name: dlt-observability-flowx-test-100
              fail_task_on_dispatch_error: "true"
          environment_key: framework_env

      environments:
        - environment_key: framework_env
          spec:
            environment_version: "4"
            dependencies:
              - ../../dist/*.whl
