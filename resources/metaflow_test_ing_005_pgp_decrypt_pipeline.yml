# Metaflow test case TC-ING-005: "Landing PGP Decryption via UC Secrets" -- a single
# ingestion flow whose source_config.source_zip_handling.pre_extraction_decryption.type is
# "pgp": a partner-style financial transactions batch is ZIPped, then PGP-encrypted (for a
# dedicated, disposable, test-only PGP keypair -- see
# sample_data/metaflow_testing/finance_usecase/pgp_test_keypair_{public,private}.asc), landed
# at /Volumes/{{catalog}}/finance/landing_pgp/incoming/, decrypted in-memory at pipeline
# execution time via crypto/pgp.py::pgp_decrypt (private key resolved from the UC secret
# {{catalog}}.security.pgp_private_key_finance_test), unzipped, and Auto Loader-ingested into
# metaflow.bronze_finance.txns_raw -- all inside one Lakeflow Declarative Pipeline update, no
# separate job task. See metaflow_testing/014_ing_005_pgp_decrypt.json and
# docs/35_tc_ing_005.md.

resources:
  pipelines:
    metaflow_test_ing_005_pgp_decrypt_pipeline:
      name: metaflow_test_ing_005_pgp_decrypt_pipeline_${bundle.target}
      catalog: metaflow
      schema: bronze_finance
      serverless: true
      photon: true
      development: true
      continuous: false

      libraries:
        - notebook:
            path: ../notebooks/03_engine/03_lakeflow_declarative_pipeline.py

      environment:
        dependencies:
          - ../dist/*.whl

      configuration:
        dataflow.group.id: dfg_ing_005_pgp_decrypt
        dataflow.control.catalog: metaflow
