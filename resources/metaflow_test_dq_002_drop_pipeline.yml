# TC-DQ-002: "DQ Action: drop Silent Row Filtering" -- proves a dq_config rule with
# action: "drop" silently filters violating rows out of the stream, never creating a
# quarantine table or failing the pipeline (unlike "warn"/"fail"/"quarantine"). "drop" maps
# onto a native Lakeflow expectation (expect_or_drop), so a violating row is simply excluded
# before it ever reaches the target table. See metaflow_testing/030_dq_002_drop.json and
# docs/51_tc_dq_002.md.

resources:
  pipelines:
    metaflow_test_dq_002_drop_pipeline:
      name: metaflow_test_dq_002_drop_pipeline_${bundle.target}
      catalog: metaflow
      schema: bronze_txns
      serverless: true
      photon: true
      development: true
      continuous: false

      libraries:
        - notebook:
            path: ../notebooks/03_engine/03_lakeflow_declarative_pipeline.py

      environment:
        dependencies:
          - ../dist/*.whl

      configuration:
        dataflow.group.id: dfg_dq_002_drop
        dataflow.control.catalog: metaflow
