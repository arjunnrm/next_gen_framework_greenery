# TC-DQ-001: "DQ Action: warn Non-Blocking Validation" -- proves a dq_config rule with
# action: "warn" never blocks or drops a row (unlike "drop"/"fail"/"quarantine"); it maps onto
# a native Lakeflow expectation, so a violating row still lands in the target table while the
# violation is only surfaced in the pipeline's own event log. See
# metaflow_testing/029_dq_001_warn.json and docs/50_tc_dq_001.md.

resources:
  pipelines:
    metaflow_test_dq_001_warn_pipeline:
      name: metaflow_test_dq_001_warn_pipeline_${bundle.target}
      catalog: metaflow
      schema: bronze_crm
      serverless: true
      photon: true
      development: true
      continuous: false

      libraries:
        - notebook:
            path: ../notebooks/03_engine/03_lakeflow_declarative_pipeline.py

      environment:
        dependencies:
          - ../dist/*.whl

      configuration:
        dataflow.group.id: dfg_dq_001_warn
        dataflow.control.catalog: metaflow
