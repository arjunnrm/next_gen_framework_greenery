site_name: FlowX
site_description: >-
  Metadata-driven ingestion, transformation, reconciliation and observability
  pipelines on Databricks Lakeflow — architecture, attribute reference, onboarding
  guides and operational runbooks.
site_author: Data Platform Engineering

docs_dir: docs
site_dir: site

# ── Theme ────────────────────────────────────────────────────────────────────
# Material is optional. If it is not installed, `mkdocs build` falls back with a
# clear error naming the missing package; install with:
#   pip install mkdocs mkdocs-material
theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

# `archive/` and `architecture_review/` are NOT living documentation, but they are
# built and navigable so the wiki is a complete account of the framework rather
# than onboarding-only. Each is labelled in the nav and carries a banner saying so.
# Only genuinely non-documentation files stay excluded.
exclude_docs: |
  CODEBASE_CLEANUP_MANIFEST.md
  README.md

# The archive's 68 pages are reached from docs/archive/index.md (generated by
# scripts/build_app_docs.py) rather than listed individually in the sidebar.
validation:
  nav:
    omitted_files: ignore
  links:
    anchors: warn

# ── Navigation ───────────────────────────────────────────────────────────────
# One tab per audience journey: arrive, learn the platform, author a spec,
# operate it, look something up.
nav:
  - Home: index.md

  # Root-relative: the wiki is served at /docs by the Spec Builder app itself, so
  # this returns the reader to the builder. Harmless when the site is hosted alone.
  - Spec Builder app: /

  - Get started:
      - Overview: onboarding/index.md
      - Step by step:
          - 1 · Prerequisites: onboarding/01_prerequisites.md
          - 2 · Your first pipeline: onboarding/02_first_pipeline.md
          - 3 · Using the Spec Builder app: onboarding/03_spec_builder_app.md
          - 4 · Deploying with DABs: onboarding/04_deploying.md
          - 5 · New-workspace bootstrap: onboarding/05_new_workspace_bootstrap.md
          - 6 · BT Digital POC deployment issues: onboarding/06_bt_digital_poc_deployment_issues.md
      - Going further:
          - Developer guide & recipes: 09_developer_guide_and_recipes.md

  - Architecture:
