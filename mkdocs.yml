site_name: NextGen Metadata Framework (Metaflow)
site_description: >-
  Metadata-driven ingestion, transformation, reconciliation and observability
  pipelines on Databricks Lakeflow — architecture, attribute reference, onboarding
  guides and operational runbooks.
site_author: Data Platform Engineering

docs_dir: docs
site_dir: site

# ── Theme ────────────────────────────────────────────────────────────────────
# Material is optional. If it is not installed, `mkdocs build` falls back with a
# clear error naming the missing package; install with:
#   pip install mkdocs mkdocs-material
theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

# Legacy and point-in-time material is kept on disk for provenance but excluded
# from the built site and its navigation. `archive/` is superseded content;
# `architecture_review/` is a dated audit, not living documentation.
exclude_docs: |
  archive/
  architecture_review/
  CODEBASE_CLEANUP_MANIFEST.md
  README.md

# ── Navigation ───────────────────────────────────────────────────────────────
# One tab per audience journey: arrive, learn the platform, author a spec,
# operate it, look something up.
nav:
